            <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- PROGRESO -->\n        <sc-if value=\"{{ alEsProgreso }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:var(--space-4); animation:tn-in .3s ease both\">\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3)\">\n              <sc-for list=\"{{ alKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n                <div class=\"card elev-sm\" style=\"padding:var(--space-4); gap:2px\">\n                  <div class=\"card-kicker\">{{ k.label }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-heading); font-size:26px; line-height:1.1\">{{ k.valor }}<\u002Fdiv>\n                  <div style=\"font-size:11px; color:var(--color-neutral-500)\">{{ k.nota }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"card elev-sm\" style=\"padding:var(--space-4); gap:var(--space-3)\">\n              <div style=\"display:flex; align-items:baseline; gap:var(--space-2)\">\n                <h6 class=\"text-muted\" style=\"margin:0\">Tu peso<\u002Fh6>\n                <span style=\"margin-left:auto; font-size:11px; color:{{ pesoResumenColor }}\">{{ pesoResumen }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:var(--space-2); align-items:flex-end; flex-wrap:wrap\">\n                <div class=\"field\" style=\"flex:1; min-width:140px; margin:0\">\n                  <label>Peso de hoy en kg<\u002Flabel>\n                  <input class=\"input\" value=\"{{ pesoNuevo }}\" sc-camel-on-change=\"{{ onPesoNuevo }}\" inputmode=\"decimal\" placeholder=\"68,5\" style=\"height:46px; font-size:17px\">\n                <\u002Fdiv>\n                <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ guardarPeso }}\" style=\"height:46px; flex:none\">{{ guardarPesoLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hayPesos }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex; align-items:flex-end; gap:5px; height:84px; padding-top:var(--space-2)\">\n                  <sc-for list=\"{{ pesoBarras }}\" as=\"b\" hint-placeholder-count=\"8\"><div title=\"{{ b.title }}\" style=\"{{ b.style }}\"><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:2px\">\n                  <sc-for list=\"{{ pesoHistorial }}\" as=\"p\" hint-placeholder-count=\"5\">\n                    <div style=\"display:flex; gap:8px; align-items:baseline; font-size:13px; padding:6px 0; border-top:1px solid var(--color-divider)\">\n                      <span style=\"flex:1; color:var(--color-neutral-400)\">{{ p.fecha }}<\u002Fspan>\n                      <span style=\"font-variant-numeric:tabular-nums\">{{ p.kg }} kg<\u002Fspan>\n                      <span style=\"{{ p.deltaStyle }}\">{{ p.delta }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sinPesos }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:12px; color:var(--color-neutral-500); line-height:1.5\">Cargá tu peso una vez por semana, siempre a la misma hora y en las mismas condiciones. Queda guardado con la fecha del día.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div class=\"card elev-sm\" style=\"padding:var(--space-4); gap:var(--space-3)\">\n              <h6 class=\"text-muted\" style=\"margin:0\">Últimas 14 semanas<\u002Fh6>\n              <div style=\"display:flex; gap:4px\">\n                <sc-for list=\"{{ racha }}\" as=\"r\" hint-placeholder-count=\"14\"><div style=\"{{ r.style }}\"><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:12px; color:var(--color-neutral-500)\">Nada de rankings ni puntos: la comparación es siempre contra vos mismo.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"card elev-sm\" style=\"padding:var(--space-4); gap:var(--space-3)\">\n              <h6 class=\"text-muted\" style=\"margin:0\">Tus mejores marcas<\u002Fh6>\n              <div style=\"display:flex; flex-direction:column; gap:var(--space-2)\">\n                <sc-for list=\"{{ alPrs }}\" as=\"p\" hint-placeholder-count=\"6\">\n                  <div style=\"display:flex; align-items:baseline; gap:var(--space-2); font-size:13px\">\n                    <span style=\"flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ p.ejercicio }}<\u002Fspan>\n                    <span>{{ p.marca }}<\u002Fspan>\n                    <span style=\"font-size:11px; color:var(--color-accent-300)\">{{ p.e1rm }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"card elev-sm\" style=\"padding:var(--space-4); gap:var(--space-3)\">\n              <h6 class=\"text-muted\" style=\"margin:0\">Tu cuenta<\u002Fh6>\n              <div style=\"font-size:12px; color:var(--color-neutral-500); line-height:1.5\">Entrás con <span style=\"color:var(--color-accent-300)\">{{ alUsuario }}<\u002Fspan>. Podés cambiar tu contraseña cuando quieras: se guarda al instante.<\u002Fdiv>\n              <div style=\"display:flex; gap:8px; flex-wrap:wrap; align-items:center\">\n                <input class=\"input\" type=\"password\" value=\"{{ claveNueva }}\" sc-camel-on-change=\"{{ onClaveNueva }}\" placeholder=\"Contraseña nueva\" style=\"flex:1; min-width:150px; height:44px\">\n                <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ guardarClave }}\" style=\"flex:none; height:44px\">{{ guardarClaveLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- NUTRICIÓN DEL ALUMNO -->\n        <sc-if value=\"{{ alEsPlan }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:var(--space-4); animation:tn-in .3s ease both\">\n            <sc-if value=\"{{ alHayPlan }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"card elev-sm\" style=\"padding:var(--space-4); gap:var(--space-3)\">\n                <div>\n                  <div class=\"card-kicker\">Tu plan<\u002Fdiv>\n                  <div style=\"font-family:var(--font-heading); font-size:18px\">{{ alPlanNombre }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:var(--space-4); flex-wrap:wrap\">\n                  <sc-for list=\"{{ planMacros }}\" as=\"mm\" hint-placeholder-count=\"4\">\n                    <div><div style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-neutral-600)\">{{ mm.k }}<\u002Fdiv><div style=\"font-family:var(--font-heading); font-size:20px\">{{ mm.v }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ comidas }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <section class=\"card elev-sm\" style=\"padding:var(--space-4); gap:var(--space-3)\">\n                  <div style=\"display:flex; align-items:baseline; gap:var(--space-2)\">\n                    <h6 class=\"text-muted\" style=\"margin:0\">{{ c.nombre }}<\u002Fh6>\n                    <span style=\"margin-left:auto; font-size:11px; color:var(--color-neutral-600)\">{{ c.objetivo }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:var(--space-2)\">\n                    <sc-for list=\"{{ c.opciones }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ o.elegir }}\" style=\"{{ o.style }}\" style-hover=\"border-color:var(--color-accent)\">\n                        <span style=\"font-size:14px; line-height:1.3; margin-bottom:8px\">{{ o.titulo }}<\u002Fspan>\n                        <span style=\"display:flex; flex-direction:column; gap:4px; width:100%; margin-bottom:8px\">\n                          <sc-for list=\"{{ o.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                            <span style=\"display:flex; gap:10px; align-items:baseline; font-size:13px\">\n                              <span style=\"flex:1; min-width:0; color:var(--color-neutral-300)\">{{ it.food }}<\u002Fspan>\n                              <span style=\"color:var(--color-accent-300); white-space:nowrap\">{{ it.cantidad }}<\u002Fspan>\n                            <\u002Fspan>\n                            <sc-if value=\"{{ it.nota }}\" hint-placeholder-val=\"{{ false }}\">\n                              <span style=\"font-size:10px; color:var(--color-neutral-600); margin-top:-3px\">{{ it.nota }}<\u002Fspan>\n                            <\u002Fsc-if>\n                          <\u002Fsc-for>\n                        <\u002Fspan>\n                        <span style=\"font-size:10px; color:var(--color-neutral-500); border-top:1px solid var(--color-divider); padding-top:6px; width:100%\">{{ o.macros }}<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsection>\n              <\u002Fsc-for>\n              <div class=\"card elev-sm\" style=\"padding:var(--space-4); gap:var(--space-3)\">\n                <h6 class=\"text-muted\" style=\"margin:0\">Lista de compras<\u002Fh6>\n                <sc-for list=\"{{ compras }}\" as=\"cat\" hint-placeholder-count=\"4\">\n                  <div>\n                    <div style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:5px\">{{ cat.nombre }}<\u002Fdiv>\n                    <div style=\"display:flex; flex-direction:column; gap:3px\">\n                      <sc-for list=\"{{ cat.items }}\" as=\"ci\" hint-placeholder-count=\"5\">\n                        <div style=\"display:flex; gap:8px; font-size:13px\"><span style=\"flex:1\">{{ ci.name }}<\u002Fspan><span style=\"color:var(--color-accent-300)\">{{ ci.qty }}<\u002Fspan><\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ alSinPlan }}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"card elev-sm\" style=\"padding:var(--space-8); align-items:center; text-align:center; gap:var(--space-2)\">\n                <div style=\"font-size:15px\">Todavía no tenés plan publicado<\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--color-neutral-500)\">Nico lo está armando. Cuando lo apruebe te va a aparecer acá con las cantidades de cada comida.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- CHAT DEL ALUMNO -->\n        <sc-if value=\"{{ alEsChat }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card elev-sm\" style=\"padding:0; overflow:hidden; gap:0; height:calc(100vh - 220px); min-height:420px; animation:tn-in .3s ease both\">\n            <div style=\"display:flex; flex-direction:column; height:100%\">\n              <div style=\"flex:1; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-4)\">\n                <sc-for list=\"{{ chatMsgs }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ m.filaAlumno }}\">\n                    <div style=\"{{ m.burbujaAlumno }}\">\n                      <div style=\"font-size:14px; line-height:1.45\">{{ m.body }}<\u002Fdiv>\n                      <div style=\"font-size:10px; color:var(--color-neutral-600); margin-top:4px; text-align:right\">{{ m.hora }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ chatVacio }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin:auto; text-align:center; font-size:12px; color:var(--color-neutral-600); max-width:240px\">Escribile a Nico lo que necesites: dudas, molestias, cómo te fue la semana.<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <form sc-camel-on-submit=\"{{ enviarMsg }}\" style=\"display:flex; gap:var(--space-2); padding:var(--space-4); box-shadow:inset 0 1px 0 var(--color-divider)\">\n                <input class=\"input\" placeholder=\"Escribile a Nico…\" value=\"{{ chatTexto }}\" sc-camel-on-change=\"{{ onChatTexto }}\" style=\"flex:1\">\n                <button type=\"submit\" class=\"btn btn-primary\" style=\"flex:none\">{{ enviarLabel }}<\u002Fbutton>\n              <\u002Fform>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <nav style=\"position:fixed; left:0; right:0; bottom:0; z-index:160; display:flex; justify-content:center; gap:2px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); backdrop-filter:blur(14px); background:color-mix(in srgb, #161826 92%, transparent); box-shadow:inset 0 1px 0 var(--color-divider)\">\n          <sc-for list=\"{{ alNav }}\" as=\"n\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ n.go }}\" style=\"{{ n.style }}\">\n              {{ n.icon }}\n              <span style=\"font-size:10px\">{{ n.label }}<\u002Fspan>\n              <sc-if value=\"{{ n.badge }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"position:absolute; top:4px; right:12px; min-width:16px; height:16px; padding:0 4px; border-radius:99px; background:var(--color-accent); color:#161826; font-size:9px; display:grid; place-items:center\">{{ n.badge }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fnav>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ esLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:200; display:grid; place-items:center; padding:var(--space-6); background:radial-gradient(1200px 600px at 20% -10%, #24273f 0%, #161826 60%)\">\n      <form sc-camel-on-submit=\"{{ entrar }}\" style=\"width:min(400px, 100%); display:flex; flex-direction:column; gap:var(--space-6); padding:var(--space-8); border-radius:var(--radius-lg); background:var(--color-surface); box-shadow:var(--shadow-lg); animation:tn-in .35s ease both\">\n        <div style=\"display:flex; align-items:center; gap:11px\">\n          <div style=\"width:38px; height:38px; flex:none; border-radius:11px; border:1px solid var(--color-accent); display:grid; place-items:center; color:var(--color-accent); font-size:15px\">TN<\u002Fdiv>\n          <div style=\"line-height:1.15\">\n            <div style=\"font-family:var(--font-heading); font-size:19px\">Trainer Nico App<\u002Fdiv>\n            <div style=\"font-size:11px; color:var(--color-neutral-500)\">Entrá con tu usuario<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Usuario<\u002Flabel>\n          <input class=\"input\" value=\"{{ loginUser }}\" sc-camel-on-change=\"{{ onLoginUser }}\" placeholder=\"trainernico\" autocomplete=\"username\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Contraseña<\u002Flabel>\n          <div style=\"display:flex; gap:var(--space-2); align-items:stretch\">\n            <input class=\"input\" type=\"{{ loginTipoClave }}\" value=\"{{ loginPass }}\" sc-camel-on-change=\"{{ onLoginPass }}\" placeholder=\"••••••••\" autocomplete=\"current-password\" style=\"flex:1; min-width:0\">\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleClave }}\" style=\"flex:none; white-space:nowrap\">{{ verClaveLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12px; color:var(--color-accent-300)\">{{ loginError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button type=\"submit\" class=\"btn btn-primary btn-block\" style=\"height:44px\">{{ loginLabel }}<\u002Fbutton>\n        <div style=\"font-size:11px; color:var(--color-neutral-600); line-height:1.5\">Los alumnos entran con su nombre y los últimos tres números del documento. Se lo generás vos al darlos de alta.<\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hayToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; right:var(--space-8); bottom:var(--space-8); z-index:90; display:flex; align-items:center; gap:10px; max-width:min(430px, calc(100vw - 48px)); padding:12px 16px; border-radius:var(--radius-md); background:var(--color-surface); box-shadow:var(--shadow-lg); animation:tn-in .2s ease both\">\n      <span style=\"color:var(--color-accent)\">{{ iconCheck }}<\u002Fspan>\n      <span style=\"font-size:13px\">{{ toast }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n  <sc-if value=\"{{ hayCelebra }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--space-5); padding:var(--space-8) var(--space-6); text-align:center; background:var(--color-bg); animation:tn-in .28s ease both\">\n      <div style=\"{{ celebra.anillo }}\">\n        <span style=\"font-size:52px; line-height:1; color:{{ celebra.color }}\">✓<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"{{ celebra.tagStyle }}\">{{ celebra.familia }} · hito conquistado<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading); font-size:29px; line-height:1.2; max-width:20ch; text-wrap:pretty\">{{ celebra.titulo }}<\u002Fdiv>\n      <p style=\"margin:0; max-width:34ch; font-size:15px; line-height:1.6; color:var(--color-neutral-300); text-wrap:pretty\">{{ celebra.mensaje }}<\u002Fp>\n      <sc-if value=\"{{ celebraHayExtra }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"tag tag-outline\" style=\"font-size:11px\">{{ celebra.extra }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"font-size:12px; letter-spacing:0.08em; color:var(--color-neutral-600)\">{{ celebra.marcador }} en tu ruta<\u002Fdiv>\n      <sc-if value=\"{{ celebraHaySiguiente }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:32ch; padding:13px 16px; border-radius:var(--radius-md); background:var(--color-neutral-900)\">\n          <div style=\"font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:5px\">Lo que sigue<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.4\">{{ celebra.siguiente }}<\u002Fdiv>\n          <div style=\"font-size:12px; color:var(--color-neutral-500); margin-top:4px\">{{ celebra.siguienteFalta }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex; gap:10px; padding-top:var(--space-2)\">\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ cerrarCelebra }}\" style=\"height:46px; padding:0 22px\">Seguir entrenando<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ celebraVerRuta }}\" style=\"height:46px\">Ver mi ruta<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hayMolestiaDlg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"position:fixed; inset:0; z-index:260; display:grid; place-items:center; padding:var(--space-4); background:color-mix(in srgb, #05070d 72%, transparent)\">\n      <div class=\"dialog elev-lg\" style=\"max-width:360px; width:100%; padding:var(--space-6); display:flex; flex-direction:column; gap:var(--space-3); animation:tn-in .2s ease both\">\n        <div style=\"font-family:var(--font-heading); font-size:17px\">¿Qué pasó con {{ molestiaEj }}?<\u002Fdiv>\n        <p class=\"card-body\" style=\"margin:0; font-size:13px; line-height:1.5\">Nico lo ve en el momento y lo tiene en cuenta la próxima vez que te arme la rutina. Si te duele, pará.<\u002Fp>\n        <div style=\"display:flex; gap:6px\">\n          <sc-for list=\"{{ molestiaNiveles }}\" as=\"mn\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ mn.set }}\" style=\"{{ mn.style }}\">{{ mn.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <input class=\"input\" value=\"{{ molestiaNota }}\" sc-camel-on-change=\"{{ onMolestiaNota }}\" placeholder=\"Dónde y cuándo te molestó (opcional)\">\n        <div style=\"display:flex; gap:8px; justify-content:flex-end\">\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cerrarMolestiaDlg }}\">Cancelar<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ enviarMolestia }}\">Avisar a Nico<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst SB_URL = 'https://hufqehcbkygwqfkiszsa.supabase.co';\nconst SB_KEY = 'sb_publishable_YqLp0bM4G8haqiTabg4H6A_84jG0dty';\n\nconst TIPOS = [\n  ['ninguno', 'Sin reloj', 'Sólo corre el descanso entre series.', []],\n  ['cronometro', 'Cronómetro libre', 'Cuenta hacia arriba hasta que el alumno lo frena.', []],\n  ['regresiva', 'Cuenta regresiva', 'Para isométricos y sostenidos.', [['duration', 'Duración (s)'], ['prepare', 'Preparación (s)']]],\n  ['tabata', 'Tabata', 'Bloques de trabajo y pausa que se repiten.', [['work', 'Trabajo (s)'], ['rest', 'Pausa (s)'], ['rounds', 'Rondas'], ['prepare', 'Preparación (s)']]],\n  ['emom', 'EMOM', 'Arranca una serie al comienzo de cada intervalo.', [['interval', 'Intervalo (s)'], ['rounds', 'Rondas'], ['prepare', 'Preparación (s)']]],\n  ['amrap', 'AMRAP', 'La mayor cantidad de rondas posibles en el tiempo fijado.', [['duration', 'Duración (s)'], ['prepare', 'Preparación (s)']]],\n  ['rondas', 'Rondas por tiempo', 'Cuenta cuánto tarda en cerrar las rondas, con tope.', [['rounds', 'Rondas'], ['cap', 'Tope (s)'], ['prepare', 'Preparación (s)']]]\n];\n\nclass Component extends DCLogic {\n  state = {\n    sesion: false, loginUser: '', loginPass: '', loginError: null, entrando: false,\n    perfil: null, alProg: null, alPlan: null, alAdh: null, alVista: 'hoy', alDiaIdx: 0, pesos: {}, activos: {}, memoria: null, elogio: null,\n    vivo: [], alertas: [], molestias: [], versiones: [], versDlg: false, motivoSug: {},\n    molestiaDlg: null, molestiaNota: '', molestiaNivel: 2, claveDlg: false, claveNueva: '',\n    claveGuardando: false, pendientes: 0, restaurando: null,\n    hilos: [], chatCon: null, chatMsgs: [], chatTexto: '', enviando: false,\n    altaAbierta: false, alta: { nombre: '', dni: '', telefono: '', objetivo: '', modalidad: 'online', dias: 3 },\n    altaCreado: null, creando: false, bajaId: null, bajaConfirm: '', generandoPlan: false,\n    vista: 'panel', cargando: true, cargandoTexto: 'Conectando con la base…', conectado: false, errorConexion: null,\n    buscar: '', toast: null, fichaId: null, filtroAlumno: 'todos',\n    alumnos: [], sugerencias: [], ejercicios: [], sync: null, presets: [],\n    filtroMusculo: 'Todos', syncing: false, syncPct: 0,\n    nuevoAbierto: false, nuevo: { nombre: '', musculo: '', equipo: '' },\n    alumnoSel: null, programas: [], progSel: null, programa: null, dia: 0,\n    pickerAbierto: false, pickerQuery: '', dirty: false,\n    encuesta: null, encuestaResp: {}, generandoEncuesta: false,\n    editandoPlan: false, alimentoDlg: null, alimento: {},\n    comentarioSesion: '', cerrandoSesion: false,\n    plantillas: [], tplNivel: 'Todos', tplFoco: 'Todos', tplDias: 'Todos', tplAbierta: null, tplDetalle: {}, asignando: null,\n    plan: null, eleccion: {}, metodo: null, prs: {}, sesionesRecientes: [],\n    promptTexto: '', generando: false, analizando: null, revisandoDia: false,\n    relojDlg: null, relojKind: 'ninguno', relojCfg: {},\n    zoom: null, drafts: {}, alPesos: [], pesosHist: {}, pesoNuevo: '', guardandoPeso: false,\n    fichaTab: 'resumen', comidaDlg: null, comidaQuery: '', comidaCat: 'Todas', comidaQty: {},\n    dragIdx: null, dragOver: null, recalcMetodo: false, guardadoEn: null, guardandoProg: false,\n    demo: null, ejIdx: 0, series: [], descanso: 0, demoSel: null, demoBusy: false,\n    verClave: false, pickerDia: null, pickerManual: '',\n    reloj: { corriendo: false, t: 0, fase: 'listo', ronda: 1 },\n    ruta: null, rutaHitos: [], rutaSel: null, rutaCelebra: null, rutaEventos: [],\n    rutas: [], rutasHitos: [], rutaBorrador: null, proponiendoRuta: false, rutaFiltro: 'todos', rutaVer: null\n  };\n\n  FAM = {\n    fuerza: ['Fuerza', 'var(--tn-fuerza)', 'var(--tn-fuerza-900)', 'var(--tn-fuerza-300)'],\n    constancia: ['Constancia', 'var(--tn-constancia)', 'var(--tn-constancia-900)', 'var(--tn-constancia-300)'],\n    tecnica: ['Técnica', 'var(--tn-tecnica)', 'var(--tn-tecnica-900)', 'var(--tn-tecnica-300)']\n  };\n\n  vistas = {\n    panel: ['Buen día, Nico', 'Todo lo que ves sale de la base en vivo'],\n    alumnos: ['Alumnos', 'Adherencia calculada sobre las sesiones realmente registradas'],\n    plantillas: ['Rutinas armadas', 'Elegí una, asignala y quedará como borrador para revisar'],\n    rutinas: ['Editor de rutinas', 'Los cambios se publican cuando vos decidís'],\n    biblioteca: ['Biblioteca de ejercicios', 'Única fuente: tu carpeta de Drive + lo que cargues a mano'],\n    nutricion: ['Nutrición', 'Cantidades por alimento en cada opción de cada comida'],\n    rutas: ['La Ruta', 'Los objetivos de cada alumno, desbloqueándose en vivo'],\n    ia: ['Método Nico', 'El perfil que la IA aprendió de cómo entrenás'],\n    chat: ['Mensajes', 'Conversaciones con tus alumnos, en vivo'],\n    alumno: ['App del alumno', 'La sesión tal como la ve en el gimnasio']\n  };\n\n  async componentDidMount() {\n    for (let i = 0; i < 80 && !window.supabase; i++) await new Promise(r => setTimeout(r, 100));\n    if (!window.supabase) {\n      this.setState({ cargando: false, sesion: false, errorConexion: 'El navegador no pudo descargar la librería de Supabase.' });\n      return;\n    }\n    this._esc = ev => { if (ev.key === 'Escape') this.setState({ zoom: null, comidaDlg: null }); };\n    window.addEventListener('keydown', this._esc);\n    this.sb = window.supabase.createClient(SB_URL, SB_KEY);\n    const { data } = await this.sb.auth.getSession();\n    if (data && data.session) { await this.arrancarSesion(); }\n    else this.setState({ cargando: false, sesion: false });\n    this.setState({ pendientes: this.colaPendiente().length });\n    this._online = () => this.vaciarCola();\n    window.addEventListener('online', this._online);\n    this._cola = setInterval(() => this.vaciarCola(), 45000);\n    this.vaciarCola();\n  }\n\n  // ── acceso: link de la app, texto de invitación y copiado ──\n  appUrl() {\n    try {\n      const l = window.location;\n      if (l.protocol === 'file:' || l.hostname === 'localhost') return 'https://trainer-nico-app.vercel.app';\n      const base = (l.origin + l.pathname).replace(/index\\.html$/i, '').replace(/\\/+$/, '');\n      return base || l.origin;\n    } catch (e) { return 'https://trainer-nico-app.vercel.app'; }\n  }\n\n  textoAcceso(nombre, usuario, clave) {\n    return 'Hola ' + String(nombre || '').split(' ')[0] + ', te paso tu acceso a Trainer Nico App.\\n\\n' +\n      'Link: ' + this.appUrl() + '\\n' +\n      'Usuario: ' + usuario + '\\n' +\n      'Contraseña: ' + clave + '\\n\\n' +\n      'Entrás desde el celular, ahí vas a ver tu rutina, cargar tus series y hablar conmigo.\\n— Nico';\n  }\n\n  copiar(texto, msg) {\n    const ok = () => this.aviso(msg || 'Copiado al portapapeles');\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(texto).then(ok, () => this.copiarViejo(texto, ok));\n      return;\n    }\n    this.copiarViejo(texto, ok);\n  }\n  copiarViejo(texto, ok) {\n    const t = document.createElement('textarea');\n    t.value = texto; t.style.position = 'fixed'; t.style.opacity = '0';\n    document.body.appendChild(t); t.select();\n    try { document.execCommand('copy'); ok(); } catch (e) { this.aviso('No se pudo copiar solo: copialo a mano'); }\n    document.body.removeChild(t);\n  }\n\n  // ── borrador de la sesión en curso, en el propio celular ──\n  hoyISO() { return new Date().toISOString().slice(0, 10); }\n\n  // Series que el alumno ya registró hoy, para que el entrenador las vea marcadas.\n  async cargarHoy(studentId) {\n    this._hoyLogs = {};\n    this._hoySes = null;\n    try {\n      const { data: ses } = await this.sb.from('workout_sessions')\n        .select('id,status,day_id').eq('student_id', studentId)\n        .gte('started_at', this.hoyISO() + 'T00:00:00')\n        .order('started_at', { ascending: false }).limit(1);\n      const s0 = (ses || [])[0];\n      if (!s0) return this._hoyLogs;\n      this._hoySes = s0;\n      const { data: logs } = await this.sb.from('set_logs')\n        .select('program_exercise_id,set_number,weight_kg,reps,rir').eq('session_id', s0.id);\n      (logs || []).forEach(r => {\n        const k = r.program_exercise_id;\n        if (!k) return;\n        (this._hoyLogs[k] = this._hoyLogs[k] || {})[Number(r.set_number)] = r;\n      });\n    } catch (e) { /* si falla, se muestra la sesión vacía */ }\n    return this._hoyLogs;\n  }\n  claveSesion(d, idx) {\n    const pe = d.dia.program_exercises[idx];\n    return 'tn-ses-' + d.student.id + '-' + d.dia.id + '-' + (pe ? pe.id : idx);\n  }\n  persistirSeries() {\n    const d = this.state.demo;\n    if (!d || !d.dia || !this.state.series.length) return;\n    try {\n      window.localStorage.setItem(this.claveSesion(d, this.state.ejIdx),\n        JSON.stringify({ fecha: this.hoyISO(), series: this.state.series }));\n    } catch (e) { /* el navegador puede tener el storage bloqueado */ }\n  }\n  limpiarBorradores(d) {\n    if (!d || !d.dia) return;\n    try {\n      d.dia.program_exercises.forEach((pe, i) => window.localStorage.removeItem(this.claveSesion(d, i)));\n    } catch (e) { /* nada que limpiar */ }\n  }\n  // El runtime no pasa prevState, así que la comparación va contra la instancia.\n  componentDidUpdate() {\n    if (this._lastSeries !== this.state.series) {\n      this._lastSeries = this.state.series;\n      this.persistirSeries();\n    }\n    try {\n      if (this._lastVista !== this.state.vista) {\n        this._lastVista = this.state.vista;\n        window.localStorage.setItem('tn-vista', this.state.vista);\n      }\n      if (this._lastAlSel !== this.state.alumnoSel && this.state.alumnoSel) {\n        this._lastAlSel = this.state.alumnoSel;\n        window.localStorage.setItem('tn-alumno-sel', this.state.alumnoSel);\n      }\n    } catch (e) { /* sin storage */ }\n  }\n\n  mensajeAliento(pe, ult) {\n    if (!pe) return '';\n    const d = this.state.demo;\n    const nom = d && d.student ? String(d.student.full_name || '').split(' ')[0] : '';\n    if (!ult) return 'Primera vez con este ejercicio. Arrancá cómodo y anotá con qué peso te quedaste: la próxima ya tenés referencia.';\n    const dias = this.dias(ult.logged_at);\n    const kg = this.nkg(ult.weight_kg);\n    if (dias > 14) return 'Volvés a este ejercicio después de ' + dias + ' días. Arrancá un poco abajo de ' + kg + ' kg y subí si sale redondo.';\n    const rir = Number(ult.rir);\n    const salto = this.saltoAprendido(pe.exercises ? pe.exercises.name : (pe.custom_name || ''));\n    const sube = salto ? ' Probá ' + this.nkg(kg + salto) + ' kg, que es el salto que venís haciendo.' : '';\n    if (rir >= 3) return 'La última la cerraste con ' + rir + ' repeticiones en el tanque. Hoy podés subir un poquito el peso' + (nom ? ', ' + nom : '') + '.' + sube;\n    if (rir <= 1) return 'La última fue al límite. Repetí los ' + kg + ' kg y buscá una repetición más prolija antes de subir.';\n    return 'Igualá ' + kg + ' kg × ' + ult.reps + '. Si te sobran, sumale 2,5 kg en la última serie.';\n  }\n\n  // Lo que la app recuerda de la semana pasada, calculado sobre las sesiones guardadas.\n  memoriaSemanal(perfil, sesiones, prog) {\n    if (!perfil) return null;\n    const nom = String(perfil.full_name || '').split(' ')[0];\n    const meta = Math.max(1, Number(perfil.weekly_target) || (prog && prog.program_days ? prog.program_days.length : 3));\n    const dia = n => n === 1 ? ' día' : ' días';\n    const hoy = new Date();\n    const lunes = new Date(hoy); lunes.setHours(0, 0, 0, 0);\n    lunes.setDate(lunes.getDate() - ((hoy.getDay() + 6) % 7));\n    const lunesPasado = new Date(lunes); lunesPasado.setDate(lunesPasado.getDate() - 7);\n    const cerradas = (sesiones || []).filter(x => x && x.status === 'completada' && x.started_at);\n    const entre = (a, b) => cerradas.filter(x => { const t = new Date(x.started_at); return t >= a && t < b; }).length;\n    const pasada = entre(lunesPasado, lunes);\n    const estaSem = entre(lunes, new Date(lunes.getTime() + 7 * 864e5));\n    const pct = Math.min(100, Math.round(estaSem / meta * 100));\n    const progreso = estaSem + ' de ' + meta + dia(meta) + ' esta semana';\n    if (!cerradas.length) return {\n      tag: 'Arrancamos', titulo: 'Hola ' + nom + ', bienvenido',\n      texto: 'Todavía no tenés sesiones cerradas. El objetivo de esta semana es completar ' + meta + dia(meta) + '. Cargá cada serie y la app se acuerda de todo por vos.',\n      pct, progreso\n    };\n    if (pasada >= meta) return {\n      tag: 'Semana pasada completa', titulo: 'Hola ' + nom + ', la semana pasada terminaste muy bien',\n      texto: 'Cerraste los ' + pasada + dia(pasada) + ' que tenías. Repetimos lo mismo esta semana y donde te sobre, subimos un poco el peso.',\n      pct, progreso\n    };\n    if (pasada > 0) return {\n      tag: 'Objetivo de la semana', titulo: 'Hola ' + nom + ', la semana pasada quedaste en ' + pasada + ' de ' + meta,\n      texto: 'Te faltaron ' + (meta - pasada) + dia(meta - pasada) + '. Esta semana tenés como objetivo completar los ' + meta + '. Vas ' + estaSem + '.',\n      pct, progreso\n    };\n    return {\n      tag: 'Volvemos', titulo: 'Hola ' + nom + ', te estábamos esperando',\n      texto: 'La semana pasada no registraste entrenamientos; tu última sesión fue ' + this.hace(cerradas[0].started_at) + '. Arrancá con el día de hoy: el objetivo de la semana es llegar a ' + meta + dia(meta) + '.',\n      pct, progreso\n    };\n  }\n\n  correoDe(usuario) {\n    const u = String(usuario || '').trim().toLowerCase().replace(/\\s+/g, '');\n    if (u.indexOf('@') > -1) return u;\n    return u === 'trainernico' || u === 'nico' ? 'trainernico@trainernico.app' : u + '@alumnos.trainernico.app';\n  }\n\n  async entrar(ev) {\n    if (ev && ev.preventDefault) ev.preventDefault();\n    if (this.state.entrando) return;\n    this.setState({ entrando: true, loginError: null });\n    const { data, error } = await this.sb.auth.signInWithPassword({\n      email: this.correoDe(this.state.loginUser), password: this.state.loginPass\n    });\n    if (error || !data.session) {\n      this.setState({ entrando: false, loginError: 'Usuario o contraseña incorrectos. Revisá que sea tu nombre seguido de los últimos tres del documento.' });\n      return;\n    }\n    this.setState({ entrando: false, loginPass: '' });\n    await this.arrancarSesion();\n  }\n\n  async arrancarSesion() {\n    this.setState({ sesion: true, conectado: true, cargando: true, errorConexion: null, cargandoTexto: 'Cargando tu información…' });\n    try {\n      const { data: u } = await this.sb.auth.getUser();\n      const { data: perfil } = await this.sb.from('profiles').select('*').eq('id', u.user.id).single();\n      this.setState({ perfil });\n      if (perfil && perfil.role === 'alumno') await this.cargarComoAlumno(perfil);\n      else await this.cargarTodo();\n    } catch (e) {\n      this.setState({ cargando: false, errorConexion: 'La base respondió con un error: ' + (e && e.message ? e.message : e) });\n    }\n  }\n\n  // Abre en el día que corresponde: si la última quedó a medias la retoma, si la cerró pasa a la siguiente.\n  diaQueSigue(p, sesiones) {\n    if (!p || !p.program_days.length) return 0;\n    const ult = (sesiones || []).find(x => x && x.day_id);\n    if (!ult) return 0;\n    const i = p.program_days.findIndex(dd => dd.id === ult.day_id);\n    if (i === -1) return 0;\n    return ult.status === 'completada' ? (i + 1) % p.program_days.length : i;\n  }\n\n  // ── panel propio del alumno ──────────────────────────────────\n  async cargarComoAlumno(perfil) {\n    const sb = this.sb;\n    const [prog, hist, ses, plan, msgs, prs, adh, bm, pg] = await Promise.all([\n      sb.from('programs').select('id, name, program_days(*, program_exercises(*, exercises(id,name,muscle_group,image_url)))')\n        .eq('student_id', perfil.id).eq('status', 'publicado').order('created_at', { ascending: false }).limit(1),\n      sb.from('current_sets').select('exercise_id,weight_kg,reps,rir,logged_at').eq('student_id', perfil.id).order('logged_at', { ascending: false }).limit(500),\n      sb.from('workout_sessions').select('started_at,day_id,status').eq('student_id', perfil.id).order('started_at', { ascending: false }).limit(200),\n      sb.from('nutrition_plans').select('*, nutrition_meals(*, nutrition_options(*, nutrition_items(*))), shopping_items(*)')\n        .eq('student_id', perfil.id).eq('status', 'publicado').order('created_at', { ascending: false }).limit(1),\n      sb.from('messages').select('*').eq('student_id', perfil.id).order('created_at' d) {\n    const { data: ops } = await this.sb.from('nutrition_options').select('id').eq('meal_id', id);\n    const ids = (ops || []).map(o => o.id);\n    if (ids.length) await this.sb.from('nutrition_items').delete().in('option_id', ids);\n    await this.sb.from('nutrition_options').delete().eq('meal_id', id);\n    await this.sb.from('nutrition_meals').delete().eq('id', id);\n    await this.recalcularPlan();\n  }\n\n  async borrarAlimento(id) {\n    await this.sb.from('nutrition_items').delete().eq('id', id);\n    await this.recalcularPlan();\n  }\n\n  async guardarAlimento() {\n    const a = this.state.alimento || {};\n    const optionId = this.state.alimentoDlg;\n    if (!optionId) return;\n    if (!String(a.food || '').trim()) { this.aviso('Poné el nombre del alimento'); return; }\n    const { count } = await this.sb.from('nutrition_items').select('id', { count: 'exact', head: true }).eq('option_id', optionId);\n    const { error } = await this.sb.from('nutrition_items').insert({\n      option_id: optionId, food: String(a.food).trim(), qty: Number(a.qty) || 0, unit: String(a.unit || 'g').trim(),\n      qty_note: String(a.qty_note || '').trim() || null, kcal: Math.round(Number(a.kcal) || 0),\n      protein_g: Number(a.protein_g) || 0, carbs_g: Number(a.carbs_g) || 0, fat_g: Number(a.fat_g) || 0,\n      sort: (count || 0) + 1\n    });\n    if (error) { this.aviso('No se pudo guardar: ' + error.message); return; }\n    this.setState({ alimentoDlg: null });\n    await this.recalcularPlan();\n  }\n\n  gPorKg(plan) {\n    const kg = (this.state.pesos || {})[plan.student_id];\n    if (!kg || !plan.protein_g) return 'peso sin cargar';\n    return (Math.round(plan.protein_g / kg * 10) / 10).toFixed(1).replace('.', ',') + ' g por kg';\n  }\n\n  async cargarPlan(studentId) {\n    if (!studentId) { this.setState({ plan: null, eleccion: {} }); return; }\n    const { data } = await this.sb.from('nutrition_plans')\n      .select('*, nutrition_meals(*, nutrition_options(*, nutrition_items(*))), shopping_items(*), nutrition_feedback(*)')\n      .eq('student_id', studentId).order('created_at', { ascending: false }).limit(1);\n    const pl = (data || [])[0] || null;\n    if (pl) {\n      pl.nutrition_meals.sort((a, b) => a.order_index - b.order_index);\n      pl.nutrition_meals.forEach(m => {\n        m.nutrition_options.sort((a, b) => a.sort - b.sort);\n        m.nutrition_options.forEach(o => (o.nutrition_items || []).sort((a, b) => a.sort - b.sort));\n      });\n    }\n    this.setState({ plan: pl, eleccion: {} });\n  }\n\n  async cargarHilos() {\n    const { data } = await this.sb.from('chat_threads').select('*');\n    const list = (data || []).sort((a, b) => new Date(b.last_at || 0) - new Date(a.last_at || 0));\n    this.setState({ hilos: list });\n  }\n\n  async abrirChat(id) {\n    this.setState({ chatCon: id, chatMsgs: [] });\n    const { data } = await this.sb.from('messages').select('*').eq('student_id', id).order('created_at');\n    this.setState({ chatMsgs: data || [] });\n    await this.sb.rpc('marcar_leidos', { p_student: id });\n    this.cargarHilos();\n    if (this._chat) this.sb.removeChannel(this._chat);\n    this._chat = this.sb.channel('chat-' + id)\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'student_id=eq.' + id },\n        payload => this.setState(s => (s.chatMsgs.some(m => m.id === payload.new.id) ? null : { chatMsgs: s.chatMsgs.concat([payload.new]) })))\n      .subscribe();\n  }\n\n  async enviarMensaje(ev) {\n    if (ev && ev.preventDefault) ev.preventDefault();\n    const txt = (this.state.chatTexto || '').trim();\n    if (!txt || !this.state.chatCon || this.state.enviando) return;\n    this.setState({ enviando: true });\n    const { data: u } = await this.sb.auth.getUser();\n    const { data } = await this.sb.from('messages')\n      .insert({ student_id: this.state.chatCon, sender_id: u.user.id, body: txt }).select().single();\n    this.setState(s => ({ enviando: false, chatTexto: '', chatMsgs: data && !s.chatMsgs.some(m => m.id === data.id) ? s.chatMsgs.concat([data]) : s.chatMsgs }));\n    this.cargarHilos();\n  }\n\n  whatsapp(alumno, texto) {\n    const tel = String(alumno.phone || '').replace(/\\D/g, '');\n    if (!tel) { this.aviso('Ese alumno no tiene teléfono cargado'); return; }\n    window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(texto), '_blank', 'noopener');\n  }\n\n  async cargarPRs(id) {\n    if (this.state.prs[id]) return;\n    const { data } = await this.sb.from('personal_records').select('*').eq('student_id', id).order('e1rm', { ascending: false }).limit(6);\n    this.setState(s => ({ prs: Object.assign({}, s.prs, { [id]: data || [] }) }));\n  }\n\n  async cargarSesionDemo() {\n    let guardado = null;\n    try { guardado = window.localStorage.getItem('tn-demo-sel'); } catch (e) { /* sin storage */ }\n    const st = this.state.alumnos.find(a => a.id === this.state.demoSel)\n      || this.state.alumnos.find(a => a.id === guardado)\n      || this.state.alumnos.find(a => a.email === 'martin@trainernico.app')\n      || this.state.alumnos[0];\n    if (!st) return;\n    await this.verSesionDe(st.id);\n  }\n\n  // Espeja la sesión de cualquier alumno: el entrenador elige a quién mira.\n  async verSesionDe(studentId, diaPref) {\n    const st = this.state.alumnos.find(a => a.id === studentId);\n    if (!st) return;\n    this.setState({ demoBusy: true, demoSel: st.id });\n    const { data } = await this.sb.from('programs')\n      .select('id, name, program_days(*, program_exercises(*, exercises(id,name,muscle_group,image_url)))')\n      .eq('student_id', st.id).eq('status', 'publicado').order('created_at', { ascending: false }).limit(1);\n    const prog = (data || [])[0];\n    if (!prog || !prog.program_days.length) {\n      this._sess = null;\n      this.setState({ demo: null, demoBusy: false, series: [] });\n      return;\n    }\n    prog.program_days.sort((a, b) => a.day_index - b.day_index);\n    prog.program_days.forEach(d => d.program_exercises.sort((a, b) => a.order_index - b.order_index));\n    const [{ data: hist }, { data: rr }, { data: pgd }] = await Promise.all([\n      this.sb.from('current_sets').select('exercise_id,weight_kg,reps,rir,logged_at').eq('student_id', st.id).order('logged_at', { ascending: false }).limit(500),\n      this.sb.from('workout_sessions').select('started_at,day_id,status').eq('student_id', st.id).order('started_at', { ascending: false }).limit(200),\n      this.sb.from('exercise_progress').select('*').eq('student_id', st.id)\n    ]);\n    this._prog = {};\n    (pgd || []).forEach(r => { this._prog[r.exercise_label] = r; });\n    const idx = diaPref == null ? this.diaQueSigue(prog, rr || []) : Math.min(diaPref, prog.program_days.length - 1);\n    const dia = prog.program_days[idx] || prog.program_days[0];\n    const ult = {};\n    (hist || []).forEach(h => { if (!ult[h.exercise_id]) ult[h.exercise_id] = h; });\n    this._ultimas = ult;\n    await this.cargarHoy(st.id);\n    this._sess = this._hoySes && this._hoySes.status === 'en_curso' && this._hoySes.day_id === dia.id ? this._hoySes.id : null;\n    try { window.localStorage.setItem('tn-demo-sel', st.id); } catch (e) { /* sin storage */ }\n    this.setState({\n      demo: { student: st, progId: prog.id, progNombre: prog.name, dias: prog.program_days, dia, sesiones: (rr || []).map(x => x.started_at) },\n      demoBusy: false, ejIdx: 0\n    }, () => this.prepararSeries(0));\n    this.escucharSesion(st.id);\n  }\n\n  elegirDiaDemo(i) {\n    const d = this.state.demo;\n    if (!d || !d.dias || !d.dias[i]) return;\n    this._sess = null;\n    this.setState(s => ({ demo: Object.assign({}, s.demo, { dia: d.dias[i] }), ejIdx: 0 }), () => this.prepararSeries(0));\n  }\n\n  // El entrenador ve entrar las series del alumno sin recargar.\n  escucharSesion(id) {\n    if (this._rtDemo) this.sb.removeChannel(this._rtDemo);\n    this._rtDemo = this.sb.channel('demo-' + id)\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'set_logs', filter: 'student_id=eq.' + id }, pl => this.llegoSerie(pl.new))\n      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'set_logs', filter: 'student_id=eq.' + id }, pl => this.llegoSerie(pl.new))\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'workout_sessions', filter: 'student_id=eq.' + id }, () => this.sesionCambio(id))\n      .subscribe();\n  }\n\n  // El alumno abrió, retomó o cerró la sesión: el espejo se acomoda solo.\n  sesionCambio(id) {\n    clearTimeout(this._refS);\n    this._refS = setTimeout(async () => {\n      const d = this.state.demo;\n      if (!d || !d.student || d.student.id !== id) return;\n      await this.cargarHoy(id);\n      const viva = this._hoySes && this._hoySes.status === 'en_curso';\n      this._sess = viva && d.dia && this._hoySes.day_id === d.dia.id ? this._hoySes.id : null;\n      this.prepararSeries(this.state.ejIdx);\n      this.refrescarPlantel();\n    }, 700);\n  }\n\n  // Todo el plantel en vivo: series, sesiones, pesos y fichas.\n  escucharPlantel() {\n    this.cargarRutas();\n    if (this._rtAll) this.sb.removeChannel(this._rtAll);\n    this._rtAll = this.sb.channel('plantel-vivo')\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'goal_milestones' }, pl => {\n        const row = pl.new || pl.old; if (!row) return;\n        this.setState(s => ({\n          rutasHitos: pl.eventType === 'DELETE' ? s.rutasHitos.filter(h => h.id !== row.id)\n            : (s.rutasHitos.some(h => h.id === row.id) ? s.rutasHitos.map(h => h.id === row.id ? Object.assign({}, h, row) : h) : s.rutasHitos.concat([row]))\n        }));\n        clearTimeout(this._refR);\n        this._refR = setTimeout(() => this.cargarRutas(), 1200);\n      })\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'set_logs' }, pl => this.pulsoPlantel(pl.new || pl.old))\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'workout_sessions' }, pl => this.pulsoPlantel(pl.new || pl.old))\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'body_metrics' }, () => this.refrescarPlantel())\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'exercise_complaints' }, () => this.refrescarPlantel())\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => this.refrescarPlantel())\n      .subscribe();\n    clearInterval(this._pulso);\n    this._pulso = setInterval(() => { if (Object.keys(this.state.activos || {}).length) this.forceUpdate(); }, 60000);\n  }\n\n  enVivo(id) {\n    const t = (this.state.activos || {})[id];\n    return !!t && Date.now() - t < 900000;\n  }\n\n  pulsoPlantel(row) {\n    if (!row || !row.student_id) return;\n    const id = row.student_id;\n    this.setState(s => ({ activos: Object.assign({}, s.activos, { [id]: Date.now() }) }));\n    const mirado = !!(this.state.demo && this.state.demo.student && this.state.demo.student.id === id);\n    if (!mirado && row.weight_kg != null) {\n      this._avisado = this._avisado || {};\n      if (Date.now() - (this._avisado[id] || 0) > 25000) {\n        this._avisado[id] = Date.now();\n        const al = this.state.alumnos.find(a => a.id === id);\n        this.aviso(String((al && al.full_name) || 'Un alumno').split(' ')[0] + ' está entrenando ahora · ' +\n          (row.exercise_label || 'serie') + ' ' + this.nkg(row.weight_kg) + ' kg × ' + row.reps);\n      }\n    }\n    this.refrescarPlantel();\n  }\n\n  // Refresco liviano: no toca la rutina que el entrenador esté editando.\n  refrescarPlantel() {\n    if (this.state.perfil && this.state.perfil.role === 'alumno') return;\n    clearTimeout(this._refP);\n    this._refP = setTimeout(async () => {\n      const sb = this.sb;\n      const [alum, adh, ses, bm, lv, alr, mol] = await Promise.all([\n        sb.from('profiles').select('*').eq('role', 'alumno').order('full_name'),\n        sb.from('student_adh
