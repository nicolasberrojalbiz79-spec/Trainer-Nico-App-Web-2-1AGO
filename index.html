 await this.sb.from('programs').insert({\n      student_id: studentId, name: t.name.slice(0, 80), goal: t.focus, weeks: t.weeks, status: 'borrador'\n    }).select().single();\n    if (error || !np) throw error || new Error('no se pudo crear el programa');\n    for (let i = 0; i < t.dias.length; i++) {\n      const d = t.dias[i];\n      const { data: nd } = await this.sb.from('program_days')\n        .insert({ program_id: np.id, day_index: i + 1, name: d.name.slice(0, 60) }).select().single();\n      if (!nd) continue;\n      const filas = d.ejercicios.map((e, j) => {\n        const id = porNombre[this.norm(e.nombre)] || this.parecido(e.nombre, porNombre);\n        return {\n          day_id: nd.id, exercise_id: id || null, custom_name: id ? null : e.nombre.slice(0, 80),\n          order_index: j + 1, sets: e.sets, reps: e.reps, rir_target: e.rir, rest_seconds: e.rest\n        };\n      });\n      if (filas.length) await this.sb.from('program_exercises').insert(filas);\n    }\n    return np.id;\n  }\n\n  // ── borradores de texto: el input escribe en memoria y recién después va a la base ──\n  // Campo numérico que se deja escribir: guarda lo tecleado tal cual y recién\n  // acomoda al rango cuando salís del campo. Sin esto, borrar el número lo\n  // devolvía al mínimo y era imposible teclear un valor de dos cifras.\n  numCampo(k, actual, min, max, commit) {\n    const d = this.state.drafts || {};\n    const raw = d[k] !== undefined ? d[k] : String(actual == null ? '' : actual);\n    return {\n      val: raw,\n      onChange: e => {\n        const v = String(e.target.value).replace(/[^0-9]/g, '');\n        this.setState(s => ({ drafts: Object.assign({}, s.drafts, { [k]: v }) }));\n        if (v !== '') {\n          const n = Number(v);\n          if (n >= min && n <= max) commit(n);\n        }\n      },\n      onBlur: () => {\n        const n = raw === '' ? Number(actual) : Math.max(min, Math.min(max, Number(raw)));\n        this.setState(s => { const dd = Object.assign({}, s.drafts); delete dd[k]; return { drafts: dd }; });\n        if (Number(n) !== Number(actual) && !isNaN(n)) commit(n);\n      }\n    };\n  }\n\n  draft(k, base) { const d = this.state.drafts || {}; return d[k] != null ? d[k] : (base == null ? '' : String(base)); }\n  setDraft(k, v, fn, ms) {\n    this.setState(s => ({ drafts: Object.assign({}, s.drafts, { [k]: v }) }));\n    this._dt = this._dt || {};\n    clearTimeout(this._dt[k]);\n    this._dt[k] = setTimeout(() => {\n      fn(v);\n      this.setState(s => { const d = Object.assign({}, s.drafts); delete d[k]; return { drafts: d }; });\n    }, ms == null ? 600 : ms);\n  }\n\n  patchPlan(fn, luego) {\n    this.setState(s => {\n      if (!s.plan) return null;\n      const p = JSON.parse(JSON.stringify(s.plan));\n      fn(p);\n      let k = 0, pr = 0, c = 0, g = 0;\n      (p.nutrition_meals || []).forEach(m => (m.nutrition_options || []).forEach(o => {\n        const t = (o.nutrition_items || []).reduce((a, i) => ({\n          k: a.k + Number(i.kcal || 0), p: a.p + Number(i.protein_g || 0),\n          c: a.c + Number(i.carbs_g || 0), g: a.g + Number(i.fat_g || 0)\n        }), { k: 0, p: 0, c: 0, g: 0 });\n        o.kcal = Math.round(t.k); o.protein_g = Math.round(t.p); o.carbs_g = Math.round(t.c); o.fat_g = Math.round(t.g);\n        if (o.is_default) { k += o.kcal; pr += o.protein_g; c += o.carbs_g; g += o.fat_g; }\n      }));\n      p.kcal = k; p.protein_g = pr; p.carbs_g = c; p.fat_g = g;\n      return { plan: p };\n    }, luego);\n  }\n\n  async persistirTotales(optionId) {\n    const p = this.state.plan; if (!p) return;\n    let opt = null;\n    (p.nutrition_meals || []).forEach(m => (m.nutrition_options || []).forEach(o => { if (o.id === optionId) opt = o; }));\n    if (opt) await this.sb.from('nutrition_options').update({ kcal: opt.kcal, protein_g: opt.protein_g, carbs_g: opt.carbs_g, fat_g: opt.fat_g }).eq('id', optionId);\n    await this.sb.from('nutrition_plans').update({ kcal: p.kcal, protein_g: p.protein_g, carbs_g: p.carbs_g, fat_g: p.fat_g }).eq('id', p.id);\n  }\n\n  editarItem(it, campo, valor, optionId) {\n    const num = ['qty', 'kcal', 'protein_g', 'carbs_g', 'fat_g'].indexOf(campo) > -1;\n    this.setDraft('it-' + it.id + '-' + campo, valor, v => {\n      const val = num ? (Number(String(v).replace(',', '.')) || 0) : v;\n      this.patchPlan(p => {\n        (p.nutrition_meals || []).forEach(m => (m.nutrition_options || []).forEach(o =>\n          (o.nutrition_items || []).forEach(x => { if (x.id === it.id) x[campo] = val; })));\n      }, async () => {\n        await this.sb.from('nutrition_items').update({ [campo]: val }).eq('id', it.id);\n        await this.persistirTotales(optionId);\n      });\n    });\n  }\n\n  async agregarDeLista(optionId, food, qty) {\n    const q = Number(String(qty).replace(',', '.')) || 100;\n    const f = q / 100;\n    const { count } = await this.sb.from('nutrition_items').select('id', { count: 'exact', head: true }).eq('option_id', optionId);\n    const { error } = await this.sb.from('nutrition_items').insert({\n      option_id: optionId, food: food.name, qty: q, unit: food.unit === 'ml' ? 'ml' : 'g',\n      qty_note: food.nota || null, kcal: Math.round(food.kcal * f),\n      protein_g: Math.round(food.prot * f * 10) / 10, carbs_g: Math.round(food.carb * f * 10) / 10,\n      fat_g: Math.round(food.fat * f * 10) / 10, sort: (count || 0) + 1\n    });\n    if (error) { this.aviso('No se pudo agregar: ' + error.message); return; }\n    await this.cargarPlan(this.state.plan.student_id);\n    this.aviso(food.name + ' · ' + q + (food.unit === 'ml' ? ' ml' : ' g') + ' agregado a la opción');\n  }\n\n  async guardarPeso() {\n    const S = this.state;\n    if (S.guardandoPeso || !S.perfil) return;\n    const kg = Number(String(S.pesoNuevo).replace(',', '.'));\n    if (!kg || kg < 25 || kg > 300) { this.aviso('Poné un peso válido, entre 25 y 300 kg'); return; }\n    this.setState({ guardandoPeso: true });\n    const hoy = new Date().toISOString().slice(0, 10);\n    const { data: ya } = await this.sb.from('body_metrics').select('id').eq('student_id', S.perfil.id).eq('measured_on', hoy).limit(1);\n    let error;\n    if (ya && ya[0]) ({ error } = await this.sb.from('body_metrics').update({ weight_kg: kg }).eq('id', ya[0].id));\n    else ({ error } = await this.sb.from('body_metrics').insert({ student_id: S.perfil.id, weight_kg: kg, measured_on: hoy }));\n    if (error) { this.setState({ guardandoPeso: false }); this.aviso('No se pudo guardar el peso: ' + error.message); return; }\n    const { data } = await this.sb.from('body_metrics').select('id,weight_kg,measured_on')\n      .eq('student_id', S.perfil.id).order('measured_on', { ascending: false }).limit(40);\n    this.setState({\n      guardandoPeso: false, pesoNuevo: '', alPesos: data || [],\n      pesos: Object.assign({}, S.pesos, { [S.perfil.id]: kg })\n    });\n    this.aviso('Peso guardado: ' + this.nkg(kg) + ' kg · ' + new Date().toLocaleDateString('es-AR'));\n  }\n\n  async refrescarAlumno() {\n    clearTimeout(this._ref);\n    this._ref = setTimeout(async () => {\n      const perfil = this.state.perfil;\n      if (!perfil) return;\n      if (!this._sess) { this.cargarComoAlumno(perfil); return; }\n      // con una sesión en curso se trae la rutina nueva sin perder lo que está cargando\n      const { data } = await this.sb.from('programs')\n        .select('id, name, program_days(*, program_exercises(*, exercises(id,name,muscle_group,image_url)))')\n        .eq('student_id', perfil.id).eq('status', 'publicado').order('created_at', { ascending: false }).limit(1);\n      const p = (data || [])[0];\n      if (!p) return;\n      p.program_days.sort((a, b) => a.day_index - b.day_index);\n      p.program_days.forEach(x => x.program_exercises.sort((a, b) => a.order_index - b.order_index));\n      const actual = this.state.demo && this.state.demo.dia ? this.state.demo.dia.id : null;\n      const dia = p.program_days.find(x => x.id === actual) || p.program_days[this.state.alDiaIdx] || p.program_days[0];\n      this.setState(s => ({ alProg: p, demo: Object.assign({}, s.demo, { dias: p.program_days, dia, progId: p.id }) }));\n      this.aviso('Nico acaba de actualizar tu rutina · ya la tenés al día');\n    }, 900);\n  }\n\n  async recalcularMetodo() {\n    if (this.state.recalcMetodo) return;\n    this.setState({ recalcMetodo: true });\n    const { data, error } = await this.sb.rpc('aprender_metodo');\n    const m = Array.isArray(data) ? data[0] : data;\n    this.setState({ recalcMetodo: false, metodo: m || this.state.metodo });\n    if (error || !m) { this.aviso('No se pudo recalcular: ' + (error ? error.message : 'la base no devolvió el método')); return; }\n    this.aviso('Método actualizado · ' + m.sessions_learned + ' sesiones, ' + m.programs_learned + ' programas, ' +\n      m.decisions_learned + ' decisiones tuyas y ' + m.edits_learned + ' ediciones. Confianza ' + Math.round(m.confidence) + '%.');\n  }\n\n  async recalcularMetodoViejo() {\n    try {\n      const { data: progs } = await this.sb.from('programs').select('id, program_days(program_exercises(sets, exercises(name, muscle_group)))');\n      const uso = {}, vol = {};\n      (progs || []).forEach(p => (p.program_days || []).forEach(d => (d.program_exercises || []).forEach(e => {\n        const n = e.exercises && e.exercises.name; if (!n) return;\n        uso[n] = (uso[n] || 0) + 1;\n        const g = (e.exercises.muscle_group) || 'Otro';\n        vol[g] = (vol[g] || 0) + Number(e.sets || 0);\n      })));\n      const favs = Object.keys(uso).sort((a, b) => uso[b] - uso[a]).slice(0, 10);\n      const nProg = Math.max(1, (progs || []).length);\n      const caps = {};\n      Object.keys(vol).forEach(g => { caps[g] = Math.max(8, Math.round(vol[g] / nProg * 2)); });\n      const { count: ses } = await this.sb.from('workout_sessions').select('id', { count: 'exact', head: true });\n      const conf = Math.max(10, Math.min(95, Math.round((ses || 0) * 1.1 + (progs || []).length * 4)));\n      const m = this.state.metodo || {};\n      const campos = { favorites: favs, volume_caps: caps, sessions_learned: ses || 0, programs_learned: (progs || []).length, confidence: conf };\n      const { error } = m.id\n        ? await this.sb.from('coach_method').update(campos).eq('id', m.id)\n        : await this.sb.from('coach_method').update(campos).gte('confidence', 0);\n      if (error) throw error;\n      const { data: nm } = await this.sb.from('coach_method').select('*').single();\n      this.setState({ metodo: nm, recalcMetodo: false });\n      this.aviso('Método actualizado con ' + (ses || 0) + ' sesiones y ' + (progs || []).length + ' programas tuyos. Confianza ' + conf + '%.');\n    } catch (e) {\n      this.setState({ recalcMetodo: false });\n      this.aviso('No se pudo recalcular: ' + (e && e.message ? e.message : e));\n    }\n  }\n\n\n  // ── series que no pudieron subir: quedan en el celular y se suben solas ──\n  colaPendiente() {\n    try { return JSON.parse(window.localStorage.getItem('tn-cola') || '[]'); } catch (e) { return []; }\n  }\n  guardarCola(q) {\n    try { window.localStorage.setItem('tn-cola', JSON.stringify(q)); } catch (e) { /* storage bloqueado */ }\n    this.setState({ pendientes: q.length });\n  }\n  encolar(fila, meta) {\n    const q = this.colaPendiente();\n    q.push({ fila, meta, ts: Date.now() });\n    this.guardarCola(q);\n    this.aviso('Sin conexión: la serie quedó guardada en el celular y se sube sola cuando vuelva la señal.');\n  }\n  async sesionDeCola(meta) {\n    if (!meta || !meta.student || !meta.day) return null;\n    const { data: viva } = await this.sb.from('workout_sessions')\n      .select('id').eq('student_id', meta.student).eq('day_id', meta.day).eq('status', 'en_curso')\n      .order('started_at', { ascending: false }).limit(1);\n    if (viva && viva[0]) return viva[0].id;\n    const { data } = await this.sb.from('workout_sessions').insert({\n      student_id: meta.student, program_id: meta.prog, day_id: meta.day, day_label: meta.label, status: 'en_curso'\n    }).select('id').single();\n    return data ? data.id : null;\n  }\n  async vaciarCola() {\n    if (this._subiendo || !this.sb) return;\n    const q = this.colaPendiente();\n    if (!q.length) { if (this.state.pendientes) this.setState({ pendientes: 0 }); return; }\n    this._subiendo = true;\n    const quedan = [];\n    for (const it of q) {\n      let sid = it.fila.session_id || null;\n      if (!sid) { try { sid = await this.sesionDeCola(it.meta); } catch (e) { sid = null; } }\n      if (!sid) { quedan.push(it); continue; }\n      const { error } = await this.sb.from('set_logs').insert(Object.assign({}, it.fila, { session_id: sid }));\n      if (error && String(error.code || '') !== '23505') quedan.push(it);\n    }\n    this._subiendo = false;\n    this.guardarCola(quedan);\n    if (q.length > quedan.length) this.aviso((q.length - quedan.length) + ' serie(s) pendientes subidas a la base.');\n  }\n\n  // ── molestias que reporta el alumno ──\n  abrirMolestia(pe) {\n    if (!pe) return;\n    this.setState({ molestiaDlg: pe.id, molestiaNota: '', molestiaNivel: 2 });\n  }\n  async guardarMolestia() {\n    const d = this.state.demo, S = this.state;\n    const pe = d && d.dia ? d.dia.program_exercises.find(x => x.id === S.molestiaDlg) : null;\n    if (!pe) { this.setState({ molestiaDlg: null }); return; }\n    const fila = {\n      student_id: d.student.id, session_id: this._sess || null, program_exercise_id: pe.id,\n      exercise_id: pe.exercise_id, exercise_label: pe.exercises ? pe.exercises.name : (pe.custom_name || 'Ejercicio'),\n      kind: 'molestia', severity: S.molestiaNivel, note: (S.molestiaNota || '').trim() || null\n    };\n    const { error } = await this.sb.from('exercise_complaints').insert(fila);\n    this.setState({ molestiaDlg: null, molestiaNota: '' });\n    if (error) { this.aviso('No se pudo avisar: ' + error.message); return; }\n    this.aviso('Listo, Nico lo ve en su panel. Si te duele, pará y escribile.');\n  }\n  async cerrarMolestia(id, nota) {\n    const { error } = await this.sb.rpc('resolver_molestia', { p_id: id, p_nota: nota || null });\n    if (error) { this.aviso('No se pudo cerrar: ' + error.message); return; }\n    this.aviso('Molestia cerrada · el Método lo registra');\n    await Promise.all([this.cargarMetodo(), this.refrescarPlantel()]);\n  }\n\n  // ── claves ──\n  async cambiarClave() {\n    const S = this.state;\n    const nueva = String(S.claveNueva || '').trim();\n    if (nueva.length < 6) { this.aviso('La clave nueva necesita al menos 6 caracteres'); return; }\n    this.setState({ claveGuardando: true });\n    const { error } = await this.sb.rpc('cambiar_mi_clave', { p_nueva: nueva });\n    this.setState({ claveGuardando: false, claveNueva: '', claveDlg: false });\n    this.aviso(error ? 'No se pudo cambiar: ' + error.message : 'Clave cambiada. La próxima vez entrás con la nueva.');\n  }\n  async blanquearClave(studentId) {\n    const { data, error } = await this.sb.rpc('blanquear_clave', { p_student: studentId, p_nueva: null });\n    if (error) { this.aviso('No se pudo blanquear: ' + error.message); return; }\n    await this.refrescarPlantel();\n    this.aviso('Clave nueva: ' + (data && data.clave ? data.clave : '—') + ' · copiásela y mandásela.');\n  }\n\n  // ── La Ruta de objetivos ────────────────────────────────────\n  // Criterio fisiológico: el escalón sale del peso que el alumno mueve HOY,\n  // del patrón del ejercicio y de cuántas sesiones lleva encima. Nunca de una tabla fija.\n  famDe(kind) { return kind === 'peso' || kind === 'volumen' ? 'fuerza' : (kind === 'tecnica' ? 'tecnica' : 'constancia'); }\n  fam(f, i) { return (this.FAM[f] || this.FAM.fuerza)[i]; }\n\n  patronEj(nombre) {\n    const n = String(nombre || '').toLowerCase();\n    if (/patada|elevaci[óo]n|abducci[óo]n|aducci[óo]n|extensi[óo]n|curl|polea/.test(n)) return 'aislado';\n    if (/sentadilla|prensa|peso muerto|hip ?thrust|estocada|zancada|b[úu]lgara|desplante|hack|pesomuerto|sumo/.test(n)) return 'tren_inferior';\n    if (/banca|press|militar|remo|dominada|jal[óo]n|fondo|empuje|pecho|espalda|arranque|cargada/.test(n)) return 'tren_superior';\n    return 'aislado';\n  }\n  // Con menos de 6 sesiones cargadas todavía no lo conocemos: se es conservador,\n  // no agresivo. Alguien que entra levantando 100 kg no es un principiante.\n  nivelPorSesiones(c) { return c < 6 ? 'sin calibrar' : (c < 24 ? 'novato' : (c < 110 ? 'intermedio' : 'avanzado')); }\n  discoDe(patron) { return patron === 'aislado' ? 1.25 : 2.5; }\n\n  // Un escalón = el salto más chico que el cuerpo puede absorber sin romper la técnica.\n  saltoKg(patron, actual, nivel, label) {\n    const disco = this.discoDe(patron);\n    const aprendido = this.saltoAprendido(label);\n    if (aprendido && aprendido > 0) return Math.max(disco, Math.round(aprendido / disco) * disco);\n    const pct = patron === 'tren_inferior' ? 0.05 : (patron === 'tren_superior' ? 0.035 : 0.025);\n    const mult = nivel === 'novato' ? 1.3 : (nivel === 'avanzado' ? 0.6 : (nivel === 'sin calibrar' ? 0.8 : 1));\n    const bruto = Number(actual || 0) * pct * mult;\n    return Math.max(disco, Math.round(bruto / disco) * disco);\n  }\n  semanasEscalon(nivel) { return nivel === 'novato' ? 2 : (nivel === 'avanzado' ? 5 : 3); }\n  explicaNivel(nivel) {\n    if (nivel === 'sin calibrar') return 'con pocas sesiones cargadas todavía, así que el salto va conservador hasta conocerte mejor';\n    if (nivel === 'novato') return 'todavía en la fase donde la fuerza sube rápido';\n    if (nivel === 'avanzado') return 'con años de entrenamiento encima, donde cada kilo cuesta más';\n    return 'con oficio ya construido';\n  }\n\n  escaleraDe(label, actual, nivel, cuantos) {\n    const patron = this.patronEj(label);\n    const out = []; let v = Number(actual || 0);\n    for (let i = 0; i < (cuantos || 3); i++) { v = Math.round((v + this.saltoKg(patron, v, nivel, label)) * 100) / 100; out.push(v); }\n    return out;\n  }\n\n  // Todo lo que la app sabe hoy del alumno, resumido para evaluar hitos.\n  contextoRuta(sets, sesiones, adh) {\n    const S = this.state;\n    const L = sets || this._setsAl || [];\n    const ses = sesiones || this._sesAl || [];\n    const a = adh || S.alAdh || null;\n    const mejores = {};\n    L.forEach(r => {\n      const k = r.exercise_id; if (!k) return;\n      const w = Number(r.weight_kg || 0), rp = Number(r.reps || 0);\n      if (!mejores[k]) mejores[k] = [];\n      mejores[k].push({ w, rp });\n    });\n    const desde = Date.now() - 7 * 86400000;\n    const vol = L.filter(r => new Date(r.logged_at).getTime() >= desde)\n      .reduce((t, r) => t + Number(r.weight_kg || 0) * Number(r.reps || 0), 0);\n    // Racha: sesiones seguidas sin un hueco mayor a 10 días.\n    const fechas = ses.map(x => new Date(x.started_at || x).getTime()).filter(Boolean).sort((x, y) => y - x);\n    let racha = 0;\n    for (let i = 0; i < fechas.length; i++) {\n      if (i === 0 && Date.now() - fechas[0] > 10 * 86400000) break;\n      if (i > 0 && fechas[i - 1] - fechas[i] > 10 * 86400000) break;\n      racha++;\n    }\n    return { mejores, volumen: Math.round(vol), racha, adherencia: a ? Number(a.adherence_pct || 0) : 0, sesiones: ses.length };\n  }\n  mejorCon(ctx, exId, reps) {\n    const l = (ctx.mejores || {})[exId] || [];\n    const ok = l.filter(x => x.rp >= (reps || 1)).map(x => x.w);\n    return ok.length ? Math.max.apply(null, ok) : 0;\n  }\n  valorActual(h, ctx) {\n    if (h.kind === 'peso') return this.mejorCon(ctx, h.exercise_id, h.target_reps);\n    if (h.kind === 'volumen') return ctx.volumen;\n    if (h.kind === 'racha') return ctx.racha;\n    if (h.kind === 'adherencia') return ctx.adherencia;\n    return null;\n  }\n\n  async cargarRutaAlumno(studentId) {\n    const { data: r } = await this.sb.from('goal_routes').select('*')\n      .eq('student_id', studentId).eq('status', 'activa').order('created_at', { ascending: false }).limit(1);\n    const ruta = (r || [])[0] || null;\n    if (!ruta) { this.setState({ ruta: null, rutaHitos: [], rutaEventos: [] }); return null; }\n    const [{ data: hs }, { data: ev }] = await Promise.all([\n      this.sb.from('goal_milestones').select('*').eq('route_id', ruta.id).order('etapa').order('ord'),\n      this.sb.from('milestone_events').select('*').eq('student_id', studentId).order('created_at', { ascending: false }).limit(30)\n    ]);\n    this.setState({ ruta, rutaHitos: hs || [], rutaEventos: ev || [] });\n    return ruta;\n  }\n\n  // El corazón: corre después de cada serie, al cerrar sesión y al abrir el panel.\n  // Guarda todo lo que calcula, así el alumno reabre y encuentra exactamente dónde quedó.\n  async evaluarRuta(callar) {\n    const S = this.state;\n    const hitos = S.rutaHitos || [];\n    if (!hitos.length || !S.ruta) return;\n    const ctx = this.contextoRuta();\n    const logros = [], updates = [], eventos = [];\n    const nuevos = hitos.map(h => {\n      if (h.kind === 'tecnica') return h;\n      const cur = this.valorActual(h, ctx);\n      if (cur == null) return h;\n      const base = Number(h.baseline_value || 0), tgt = Number(h.target_value || 0);\n      const pct = tgt > base ? Math.round(Math.max(0, Math.min(100, (cur - base) / (tgt - base) * 100)))\n                             : (cur >= tgt ? 100 : 0);\n      let st = h.status;\n      if (st === 'bloqueado' && pct > 0) st = 'en_curso';\n      if (cur + 1e-6 >= tgt && tgt > 0 && st !== 'conquistado') st = 'conquistado';\n      else if (h.status === 'conquistado' && tgt > 0 && cur < tgt * 0.92) st = 'reconquistar';\n      const cambio = st !== h.status || pct !== Number(h.progress_pct || 0) || Number(h.current_value || 0) !== cur;\n      if (!cambio) return h;\n      const campos = { current_value: cur, progress_pct: pct, status: st };\n      if (st === 'conquistado' && h.status !== 'conquistado') campos.unlocked_at = new Date().toISOString();\n      if (st === 'reconquistar' && h.status !== 'reconquistar') campos.reconquer_at = new Date().toISOString();\n      updates.push({ id: h.id, campos });\n      const ev = st !== h.status\n        ? (st === 'conquistado' ? (h.status === 'reconquistar' ? 'reconquistado' : 'conquistado') : (st === 'reconquistar' ? 'reconquistar' : 'avance'))\n        : 'avance';\n      if (ev !== 'avance' || pct !== Number(h.progress_pct || 0))\n        eventos.push({ milestone_id: h.id, student_id: h.student_id, event: ev, value: cur, progress_pct: pct });\n      const fin = Object.assign({}, h, campos);\n      if (st === 'conquistado' && h.status !== 'conquistado') logros.push(fin);\n      return fin;\n    });\n    if (!updates.length) return;\n    this.setState({ rutaHitos: nuevos });\n    for (const u of updates) { try { await this.sb.from('goal_milestones').update(u.campos).eq('id', u.id); } catch (e) { /* la cola offline lo reintenta al volver */ } }\n    if (eventos.length) { try { await this.sb.from('milestone_events').insert(eventos); } catch (e) { /* histórico best-effort */ } }\n    if (logros.length && !callar) this.celebrar(logros, nuevos);\n    await this.extenderRuta(nuevos);\n  }\n\n  celebrar(logros, todos) {\n    const h = logros[0];\n    const nom = String((this.state.perfil || {}).full_name || '').split(' ')[0];\n    const sig = (todos || []).filter(x => x.status !== 'conquistado' && x.familia === h.familia)\n      .sort((a, b) => Number(b.progress_pct || 0) - Number(a.progress_pct || 0))[0] || null;\n    const hechos = (todos || []).filter(x => x.status === 'conquistado').length;\n    this.setState({\n      rutaCelebra: {\n        hito: h, extra: logros.length - 1, familia: h.familia, hechos, total: (todos || []).length,\n        mensaje: h.coach_note || this.mensajeNico(h, nom),\n        siguiente: sig ? sig.title : null,\n        siguienteFalta: sig ? this.faltaTexto(sig) : null\n      }\n    });\n    try { if (navigator.vibrate) navigator.vibrate([28, 60, 28, 60, 90]); } catch (e) { /* sin vibración */ }\n  }\n  mensajeNico(h, nom) {\n    const q = nom ? nom + ', ' : '';\n    if (h.kind === 'peso') return q + 'esto no te lo regaló nadie. ' + h.exercise_label + ' a ' + this.nkg(h.target_value) + ' kg es tuyo y queda registrado para siempre.';\n    if (h.kind === 'volumen') return q + 'moviste más tonelaje que nunca en una semana. Ese es el trabajo que después se ve.';\n    if (h.kind === 'racha') return q + 'la constancia es lo más difícil de sostener y la venís sosteniendo. Seguí.';\n    if (h.kind === 'adherencia') return q + 'llegaste al nivel de cumplimiento que te propuse. Ahora es hábito.';\n    return q + 'hito conquistado. Vamos por el que sigue.';\n  }\n  faltaTexto(h) {\n    const cur = Number(h.current_value || 0), tgt = Number(h.target_value || 0);\n    const d = Math.round((tgt - cur) * 100) / 100;\n    if (d <= 0) return 'lo tenés a tiro';\n    if (h.kind === 'peso') return 'te faltan ' + this.nkg(d) + ' kg';\n    if (h.kind === 'volumen') return 'te faltan ' + Math.round(d).toLocaleString('es-AR') + ' kg de volumen';\n    if (h.kind === 'racha') return 'te faltan ' + Math.ceil(d) + (Math.ceil(d) === 1 ? ' sesión' : ' sesiones');\n    if (h.kind === 'adherencia') return 'te faltan ' + Math.ceil(d) + ' puntos';\n    return 'en curso';\n  }\n\n  // Sin fin, siempre suma: cuando la etapa está casi cerrada, aparece la que sigue.\n  async extenderRuta(hitos) {\n    const S = this.state, ruta = S.ruta;\n    if (!ruta || this._extendiendo) return;\n    const H = hitos || S.rutaHitos;\n    const etapa = ruta.etapa || 1;\n    const dela = H.filter(h => Number(h.etapa || 1) === etapa);\n    if (!dela.length) return;\n    const hechos = dela.filter(h => h.status === 'conquistado').length;\n    if (hechos / dela.length < 0.7) return;\n    if (H.some(h => Number(h.etapa || 1) > etapa)) {\n      await this.sb.from('goal_routes').update({ etapa: etapa + 1 }).eq('id', ruta.id);\n      this.setState(s => ({ ruta: Object.assign({}, s.ruta, { etapa: etapa + 1 }) }));\n      return;\n    }\n    this._extendiendo = true;\n    try {\n      const filas = this.armarHitos(ruta.student_id, ruta.id, etapa + 1, ruta.nivel, H);\n      if (filas.length) {\n        const { data } = await this.sb.from('goal_milestones').insert(filas).select();\n        await this.sb.from('goal_routes').update({ etapa: etapa + 1 }).eq('id', ruta.id);\n        this.setState(s => ({\n          ruta: Object.assign({}, s.ruta, { etapa: etapa + 1 }),\n          rutaHitos: s.rutaHitos.concat(data || [])\n        }));\n      }\n    } catch (e) { /* la próxima serie lo reintenta */ }\n    this._extendiendo = false;\n  }\n\n  // Construye los hitos de una etapa con criterio, sobre los números reales del alumno.\n  armarHitos(studentId, routeId, etapa, nivel, previos, progExplicito) {\n    const S = this.state;\n    const prog = progExplicito || S.alProg || (S.programas || []).find(p => p.student_id === studentId && p.status === 'publicado') || null;\n    const ctx = this.contextoRuta();\n    const lvl = nivel || this.nivelPorSesiones(ctx.sesiones);\n    const sem = this.semanasEscalon(lvl);\n    const ejs = [];\n    (prog ? prog.program_days : []).forEach(d => (d.program_exercises || []).forEach(pe => {\n      const label = pe.exercises ? pe.exercises.name : (pe.custom_name || '');\n      const id = pe.exercise_id;\n      if (!id || !label || ejs.some(x => x.id === id)) return;\n      ejs.push({ id, label, patron: this.patronEj(label) });\n    }));\n    const orden = { tren_inferior: 0, tren_superior: 1, aislado: 2 };\n    ejs.sort((a, b) => orden[a.patron] - orden[b.patron]);\n    const yaHechos = (previos || []).filter(h => h.kind === 'peso');\n    const filas = []; let ord = 1;\n    const nuevo = o => filas.push(Object.assign({\n      route_id: routeId, student_id: studentId, etapa, ord: ord++, unit: 'kg'\n    }, o));\n\n    ejs.slice(0, 3).forEach(e => {\n      const previosDelEj = yaHechos.filter(h => h.exercise_id === e.id).map(h => Number(h.target_value || 0));\n      const techo = previosDelEj.length ? Math.max.apply(null, previosDelEj) : 0;\n      const reps = e.patron === 'aislado' ? 10 : (e.patron === 'tren_inferior' ? 5 : 6);\n      const actual = Math.max(techo, this.mejorCon(ctx, e.id, reps));\n      if (!actual) {\n        // Sin historial no se inventa un número: primero se registra el peso de trabajo.\n        nuevo({\n          kind: 'tecnica', familia: 'tecnica',\n          title: 'Encontrar tu peso de trabajo en ' + e.label,\n          detail: 'Registrá ' + e.label + ' en 3 sesiones con técnica prolija y RIR 2. Ahí arranca tu escalera.',\n          razonamiento: 'Todavía no hay series cargadas de este ejercicio. Sin una base medida, cualquier objetivo de peso sería un número inventado.',\n          exercise_id: e.id, exercise_label: e.label, target_value: 3, unit: 'sesiones',\n          status: etapa === 1 ? 'en_curso' : 'bloqueado'\n        });\n        return;\n      }\n      const salto = this.saltoKg(e.patron, actual, lvl, e.label);\n      const meta = Math.round((actual + salto) * 100) / 100;\n      nuevo({\n        kind: 'peso', familia: 'fuerza',\n        title: e.label + ' · ' + this.nkg(meta) + ' kg × ' + reps,\n        detail: 'Hoy movés ' + this.nkg(actual) + ' kg × ' + reps + '. El escalón es +' + this.nkg(salto) + ' kg.',\n        razonamiento: 'Es un ' + Math.round(salto / actual * 100) + '% sobre lo que levantás hoy. En ' +\n          (e.patron === 'aislado' ? 'un ejercicio de aislamiento' : (e.patron === 'tren_inferior' ? 'un básico de tren inferior' : 'un básico de tren superior')) +\n          ', y estando ' + this.explicaNivel(lvl) + ', un salto de ese tamaño se absorbe en unas ' + sem + ' semanas sin perder técnica ni acumular fatiga de más.',\n        exercise_id: e.id, exercise_label: e.label,\n        target_value: meta, target_reps: reps, baseline_value: actual, current_value: actual,\n        status: etapa === 1 ? 'en_curso' : 'bloqueado'\n      });\n    });\n\n    const rachaBase = ctx.racha;\n    const rachaMeta = Math.max(4, rachaBase + (lvl === 'novato' ? 3 : 4)) + (etapa - 1) * 4;\n    nuevo({\n      kind: 'racha', familia: 'constancia',\n      title: rachaMeta + ' sesiones seguidas sin faltar',\n      detail: 'Llevás ' + rachaBase + '. Sin huecos de más de 10 días.',\n      razonamiento: 'La adaptación necesita repetirse antes de consolidarse. Cortar más de 10 días empieza a devolver lo ganado, así que la racha vale tanto como el peso.',\n      target_value: rachaMeta, baseline_value: rachaBase, current_value: rachaBase, unit: 'sesiones',\n      status: etapa === 1 ? 'en_curso' : 'bloqueado'\n    });\n\n    const adhBase = ctx.adherencia;\n    const adhMeta = Math.min(92, Math.max(60, Math.round(adhBase / 5) * 5 + 8));\n    if (adhMeta > adhBase) nuevo({\n      kind: 'adherencia', familia: 'constancia',\n      title: 'Sostener ' + adhMeta + '% de adherencia en el mes',\n      detail: 'Venís en ' + adhBase + '%.',\n      razonamiento: 'Subir de a 8 puntos por vez es sostenible; saltar a 100% de golpe casi siempre termina en abandono.',\n      target_value: adhMeta, baseline_value: adhBase, current_value: adhBase, unit: '%',\n      status: etapa === 1 ? 'en_curso' : 'bloqueado'\n    });\n\n    if (ctx.volumen > 0) {\n      const volMeta = Math.round(ctx.volumen * (lvl === 'novato' ? 1.12 : 1.07) / 100) * 100;\n      nuevo({\n        kind: 'volumen', familia: 'fuerza',\n        title: volMeta.toLocaleString('es-AR') + ' kg de volumen en una semana',\n        detail: 'Tu mejor semana viene siendo ' + ctx.volumen.toLocaleString('es-AR') + ' kg.',\n        razonamiento: 'Un ' + (lvl === 'novato' ? '12' : '7') + '% más de tonelaje semanal es el rango donde el estímulo crece sin que la recuperación se quede corta.',\n        target_value: volMeta, baseline_value: ctx.volumen, current_value: ctx.volumen, unit: 'kg',\n        status: etapa === 1 ? 'en_curso' : 'bloqueado'\n      });\n    }\n    return filas;\n  }\n\n  // La IA propone la ruta entera; Nico la aprueba o la edita. Nunca se publica sola.\n  async proponerRuta(studentId) {\n    if (this.state.proponiendoRuta) return;\n    this.setState({ proponiendoRuta: true, rutaBorrador: null });\n    try {\n      const al = this.state.alumnos.find(a => a.id === studentId);\n      if (!al) throw new Error('alumno no encontrado');\n      // Se lee todo de la base en el momento: no dependemos de que el estado esté al día.\n      const [{ data: sets }, { data: ses }, { data: progs }, { data: prg }] = await Promise.all([\n        this.sb.from('current_sets').select('exercise_id,weight_kg,reps,logged_at').eq('student_id', studentId).order('logged_at', { ascending: false }).limit(500),\n        this.sb.from('workout_sessions').select('started_at').eq('student_id', studentId).order('started_at', { ascending: false }).limit(200),\n        this.sb.from('programs').select('id, student_id, status, program_days(*, program_exercises(*, exercises(id,name)))')\n          .eq('student_id', studentId).eq('status', 'publicado').order('created_at', { ascending: false }).limit(1),\n        this.sb.from('exercise_progress').select('*').eq('student_id', studentId)\n      ]);\n      this._setsAl = sets || []; this._sesAl = ses || [];\n      this._prog = {}; (prg || []).forEach(r => { this._prog[r.exercise_label] = r; });\n      const prog = (progs || [])[0] || null;\n      if (!prog) throw new Error('ese alumno todavía no tiene rutina publicada');\n      (prog.program_days || []).sort((a, b) => a.day_index - b.day_index);\n      (prog.program_days || []).forEach(d => (d.program_exercises || []).sort((a, b) => a.order_index - b.order_index));\n      const ctx = this.contextoRuta(sets || [], ses || [], al);\n      const nivel = this.nivelPorSesiones(ctx.sesiones);\n      const base = this.armarHitos(studentId, null, 1, nivel, [], prog);\n      if (!base.length) throw new Error('no pude calcular hitos: esa rutina no tiene ejercicios cargados');\n\n      // La IA no inventa números: recibe los que calculamos y sólo afina título, detalle y porqué.\n      let ia = null;\n      try {\n        const raw = await this.ia(this.contextoIA() +\n          '\\n\\nAlumno: ' + al.full_name + ' · objetivo ' + (al.goal || 'sin definir') + ' · nivel estimado ' + nivel +\n          ' · ' + ctx.sesiones + ' sesiones registradas · adherencia ' + ctx.adherencia + '%.\\n' +\n          'Estos son los hitos que calculé con criterio fisiológico. NO cambies target_value, target_reps ni baseline_value: son datos medidos.\\n' +\n          JSON.stringify(base.map((h, i) => ({ i, kind: h.kind, title: h.title, target_value: h.target_value, exercise_label: h.exercise_label || null }))) +\n          '\\n\\nRespondé SÓLO un JSON: {\"rationale\":\"dos frases sobre por qué esta ruta le sirve a este alumno en particular\",' +\n          '\"hitos\":[{\"i\":0,\"title\":\"máx 58 caracteres, concreto\",\"detail\":\"una frase con el dato actual\",\"razonamiento\":\"una o dos frases de porqué fisiológico, en segunda persona\",\"coach_note\":\"lo que Nico le diría al conquistarlo, una frase\"}]}\\n' +\n          'Español rioplatense, vos, sin emojis, sin texto fuera del JSON.', 4000);\n        ia = this.parseJSON(raw);\n      } catch (e) { ia = null; }\n      if (ia && Array.isArray(ia.hitos)) ia.hitos.forEach(x => {\n        const h = base[Number(x.i)];\n        if (!h) return;\n        if (x.title) h.title = String(x.title).slice(0, 90);\n        if (x.detail) h.detail = String(x.detail).slice(0, 200);\n        if (x.razonamiento) h.razonamiento = String(x.razonamiento).slice(0, 320);\n        if (x.coach_note) h.coach_note = String(x.coach_note).slice(0, 200);\n      });\n\n      const { data: ruta, error } = await this.sb.from('goal_routes').insert({\n        student_id: studentId, name: 'La Ruta de ' + String(al.full_name).split(' ')[0],\n        status: 'borrador', etapa: 1, nivel,\n        rationale: (ia && ia.rationale) ? String(ia.rationale).slice(0, 400)\n          : 'Ruta calculada sobre ' + ctx.sesiones + ' sesiones registradas: los pesos salen de lo que ' + String(al.full_name).split(' ')[0] + ' mueve hoy, con saltos de nivel ' + nivel + '.'\n      }).select().single();\n      if (error) throw error;\n      const filas = base.map(h => Object.assign({}, h, { route_id: ruta.id }));\n      const { data: hs, error: e2 } = await this.sb.from('goal_milestones').insert(filas).select();\n      if (e2) throw e2;\n      this.setState({ rutaBorrador: { ruta, hitos: hs || [], alumno: al }, vista: 'rutas', rutaVer: studentId });\n      this.aviso('Ruta propuesta para ' + al.full_name + '. Revisala y aprobala.');\n    } catch (e) {\n      this.aviso('No pude armar la ruta: ' + (e.message || 'error'));\n    }\n    this.setState({ proponiendoRuta: false });\n  }\n\n  async aprobarRuta(rutaId, studentId) {\n    await this.sb.from('goal_routes').update({ status: 'archivada' }).eq('student_id', studentId).eq('status', 'activa');\n    await this.sb.from('goal_routes').update({\n      status: 'activa', approved_at: new Date().toISOString(),\n      approved_by: (this.state.perfil || {}).id || null\n    }).eq('id', rutaId);\n    const { data: hs } = await this.sb.from('goal_milestones').select('id,student_id').eq('route_id', rutaId);\n    if (hs && hs.length) await this.sb.from('milestone_events').insert(hs.map(h => ({\n      milestone_id: h.id, student_id: h.student_id, event: 'creado', note: 'Ruta aprobada por Nico'\n    })));\n    this.setState({ rutaBorrador: null });\n    await this.cargarRutas();\n    this.aviso('Ruta activa. El alumno ya la ve en su panel.');\n    this.aprenderSolo();\n  }\n  async descartarRuta(rutaId) {\n    await this.sb.from('goal_milestones').delete().eq('route_id', rutaId);\n    await this.sb.from('goal_routes').delete().eq('id', rutaId);\n    this.setState({ rutaBorrador: null });\n    await this.cargarRutas();\n  }\n  async editarHito(id, campos) {\n    this.setState(s => ({\n      rutaBorrador: s.rutaBorrador ? Object.assign({}, s.rutaBorrador, {\n        hitos: s.rutaBorrador.hitos.map(h => h.id === id ? Object.assign({}, h, campos) : h)\n      }) : null,\n      rutasHitos: s.rutasHitos.map(h => h.id === id ? Object.assign({}, h, campos) : h)\n    }));\n    await this.sb.from('goal_milestones').update(campos).eq('id', id);\n  }\n  // Los hitos de técnica los valida Nico a mano: no hay sensor que mida una sentadilla prolija.\n  async validarTecnica(h) {\n    const campos = { status: 'conquistado', progress_pct: 100, unlocked_at: new Date().toISOString(), current_value: h.target_value };\n    await this.sb.from('goal_milestones').update(campos).eq('id', h.id);\n    await this.sb.from('milestone_events').insert({\n      milestone_id: h.id, student_id: h.student_id, event: 'conquistado', progress_pct: 100, note: 'Técnica validada por Nico'\n    });\n    this.setState(s => ({ rutasHitos: s.rutasHitos.map(x => x.id === h.id ? Object.assign({}, x, campos) : x) }));\n    this.aviso('Hito validado. El alumno lo ve en el momento.');\n  }\n\n  async cargarRutas() {\n    const [{ data: rp }, { data: hs }, { data: bor }] = await Promise.all([\n      this.sb.from('route_progress').select('*'),\n      this.sb.from('goal_milestones').select('*, goal_routes!inner(status)').eq('goal_routes.status', 'activa').order('etapa').order('ord'),\n      this.sb.from('goal_routes').select('*, profiles(full_name)').eq('status', 'borrador').order('created_at', { ascending: false }).limit(1)\n    ]);\n    // Una propuesta sin aprobar sobrevive a la recarga: sigue esperándote donde la dejaste.\n    let borrador = null;\n    const b0 = (bor || [])[0];\n    if (b0) {\n      const { data: bh } = await this.sb.from('goal_milestones').select('*').eq('route_id', b0.id).order('ord');\n      const al = (this.state.alumnos || []).find(a => a.id === b0.student_id)\n        || { id: b0.student_id, full_name: (b0.profiles && b0.profiles.full_name) || 'Alumno' };\n      borrador = { ruta: b0, hitos: bh || [], alumno: al };\n    }\n    this.setState({ rutas: rp || [], rutasHitos: hs || [], rutaBorrador: borrador });\n  }\n\n  // ── método: lectura y recálculo ──\n  async cargarMetodo() {\n    const { data } = await this.sb.from('coach_method').select('*').single();\n    if (data) this.setState({ metodo: data });\n    return data;\n  }\n  aprenderSolo() {\n    if (this.state.perfil && this.state.perfil.role === 'alumno') return;\n    clearTimeout(this._apr);\n    this._apr = setTimeout(async () => {\n      const { data } = await this.sb.rpc('aprender_metodo');\n      const m = Array.isArray(data) ? data[0] : data;\n      if (m) this.setState({ metodo: m });\n    }, 1500);\n  }\n  saltoAprendido(label) {\n    const p = (this._prog || {})[label];\n    const n = p && p.salto_promedio ? Number(p.salto_promedio) : null;\n    return n && n > 0 ? Math.round(n * 10) / 10 : null;\n  }\n\n  // ── versiones de rutina ──\n  async cargarVersiones(programId) {\n    if (!programId) { this.setState({ versiones: [] }); return; }\n    const { data } = await this.sb.from('program_versions')\n      .select('id,version,label,reason,created_at,snapshot')\n      .eq('program_id', programId).order('version', { ascending: false }).limit(20);\n    this.setState({ versiones: data || [] });\n  }\n  async versionar(programId, motivo) {\n    if (!programId) return null;\n    const { data, error } = await this.sb.rpc('guardar_version_programa', { p_program: programId, p_reason: motivo || null });\n    if (error) return null;\n    if (data && !data.sin_cambios) { this.cargarVersiones(programId); this.aprenderSolo(); }\n    return data;\n  }\n  async restaurarVersion(id) {\n    if (this.state.restaurando) return;\n    this.setState({ restaurando: id });\n    const { data, error } = await this.sb.rpc('restaurar_version_programa', { p_version: id });\n    this.setState({ restaurando: null });\n    if (error) { this.aviso('No se pudo restaurar: ' + error.message); return; }\n    const prog = this.state.programa;\n    if (prog) { await this.cargarProgramas(prog.student_id, prog.id); await this.cargarVersiones(prog.id); }\n    this.aviso('Rutina restaurada desde v' + (data && data.desde_version ? data.desde_version : '?') +\n      '. La versión anterior quedó guardada igual.');\n  }\n\n  async completarSerie(i) {\n    const d = this.state.demo; if (!d) return;\n    const pe = d.dia.program_exercises[this.state.ejIdx];\n    const era = this.state.series[i].hecha;\n    const s = this.state.series[i];\n    this.setState(st => ({ series: st.series.map((x, j) => j === i ? Object.assign({}, x, { hecha: !x.hecha }) : x) }));\n    if (era) { clearInterval(this._t); this.setState({ descanso: 0 }); return; }\n    this._miSerie = Date.now();\n    this.arrancarDescanso(pe.rest_seconds || 90);\n    this.elogiar(pe, s);\n    const fila = {\n      student_id: d.student.id, program_exercise_id: pe.id, exercise_id: pe.exercise_id,\n      exercise_label: pe.exercises ? pe.exercises.name : (pe.custom_name || 'Ejercicio'),\n      set_number: i + 1, weight_kg: s.peso || null, reps: s.reps, rir: s.rir, rpe: 10 - s.rir,\n      timer_result: pe.timer ? { kind: pe.timer.kind, ronda: this.state.reloj.ronda } : null\n    };\n    const meta = { student: d.student.id, prog: d.progId, day: d.dia.id, label: d.dia.name };\n    let sid = null;\n    try { sid = await this.sesionAbierta(); } catch (e) { sid = null; }\n    if (!sid) { this.encolar(fila, meta); return; }\n    const { error } = await this.sb.from('set_logs').insert(Object.assign({ session_id: sid }, fila));\n    if (error) this.encolar(fila, meta);\n    // La serie recién cargada cuenta para la Ruta en el acto, sin esperar a cerrar la sesión.\n    this._setsAl = [{ exercise_id: pe.exercise_id, weight_kg: s.peso, reps: s.reps, logged_at: new Date().toISOString() }].concat(this._setsAl || []);\n    this.evaluarRuta();\n  }\n\n  // Un solo mensaje por ejercicio y por día: aliento, nunca ruido.\n  elogiar(pe, s) {\n    if (!pe) return;\n    const clave = pe.id + '-' + this.hoyISO();\n    this._elogios = this._elogios || {};\n    if (this._elogios[clave]) return;\n    const nombre = pe.exercises ? pe.exercises.name : (pe.custom_name || 'este ejercicio');\n    const ref = this._refEj || null;\n    const antes = ref ? Number(ref.weight_kg || 0) : 0;\n    const hechas = this.state.series.filter(x => x.hecha).length + 1;\n    let msg = null;\n    if (antes && Number(s.peso) > antes)\n      msg = 'Muy bien elevando el peso en ' + nombre + ': ' + this.nkg(s.peso) + ' kg contra ' + this.nkg(antes) + ' kg de la última vez. Seguí así.';\n    else if (antes && Number(s.peso) === antes && ref && Number(s.reps) > Number(ref.reps || 0))\n      msg = 'Mismo peso y más repeticiones en ' + nombre + '. Eso también es progreso.';\n    else if (this.state.series.length > 1 && hechas >= this.state.series.length)\n      msg = nombre + ' completo, ' + this.state.series.length + ' series cargadas. Vamos al que sigue.';\n    if (!msg) return;\n    this._elogios[clave] = msg;\n    this.setState({ elogio: msg });\n    clearTimeout(this._elg);\n    this._elg = setTimeout(() => this.setState({ elogio: null }), 14000);\n  }\n\n  // Retoma la sesión que ya estaba abierta en vez de abrir una nueva por cada recarga.\n  async sesionAbierta() {\n    if (this._sess) return this._sess;\n    const d = this.state.demo;\n    if (!d) return null;\n    const { data: viva } = await this.sb.from('workout_sessions')\n      .select('id').eq('student_id', d.student.id).eq('day_id', d.dia.id).eq('status', 'en_curso')\n      .order('started_at', { ascending: false }).limit(1);\n    if (viva && viva[0]) { this._sess = viva[0].id; return this._sess; }\n    const { data } = await this.sb.from('workout_sessions').insert({\n      student_id: d.student.id, program_id: d.progId, day_id: d.dia.id, day_label: d.dia.name, status: 'en_curso'\n    }).select('id').single();\n    this._sess = data ? data.id : null;\n    return this._sess;\n  }\n\n  // Rescata el JSON aunque venga con texto alrededor o cortado a la mitad.\n  parseJSON(raw) {\n    const txt = String(raw).trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();\n    const desde = txt.indexOf('{');\n    if (desde === -1) throw new Error('la IA no devolvió un JSON');\n    const cuerpo = txt.slice(desde);\n    try { return JSON.parse(cuerpo); } catch (e) { /* intentamos repararlo */ }\n    let prof = 0, enTexto = false, escape = false, corte = -1;\n    for (let i = 0; i < cuerpo.length; i++) {\n      const ch = cuerpo[i];\n      if (escape) { escape = false; continue; }\n      if (ch === '\\\\') { escape = true; continue; }\n      if (ch === '\"') { enTexto = !enTexto; continue; }\n      if (enTexto) continue;\n      if (ch === '{' || ch === '[') prof++;\n      else if (ch === '}' || ch === ']') { prof--; if (prof === 0) corte = i; }\n    }\n    if (corte > -1) return JSON.parse(cuerpo.slice(0, corte + 1));\n    let reparado = cuerpo.replace(/,\\s*$/, '');\n    const pila = [];\n    enTexto = false; escape = false;\n    for (let i = 0; i < reparado.length; i++) {\n      const ch = reparado[i];\n      if (escape) { escape = false; continue; }\n      if (ch === '\\\\') { escape = true; continue; }\n      if (ch === '\"') { enTexto = !enTexto; continue; }\n      if (enTexto) continue;\n      if (ch === '{') pila.push('}');\n      else if (ch === '[') pila.push(']');\n      else if (ch === '}' || ch === ']') pila.pop();\n    }\n    if (enTexto) reparado += '\"';\n    reparado = reparado.replace(/,\\s*$/, '');\n    while (pila.length) reparado += pila.pop();\n    return JSON.parse(reparado);\n  }\n\n  async ia(prompt, maxTokens) {\n    const { data, error } = await this.sb.functions.invoke('ia', { body: { prompt, max_tokens: maxTokens || 8000, json_mode: true } });\n    if (!error && data && data.texto) return data.texto;\n    let detalle = error ? error.message : (data && data.error ? data.error : '');\n    if (error && error.context && typeof error.context.json === 'function') {\n      try { const j = await error.context.json(); if (j && j.error) detalle = j.error; } catch (e) { /* sin cuerpo */ }\n    }\n    if (typeof window !== 'undefined' && window.claude && window.claude.complete) {\n      return await window.claude.complete({ model: 'claude-haiku-4-5', max_tokens: maxTokens || 4000, messages: [{ role: 'user', content: prompt }] });\n    }\n    throw new Error(detalle || 'la IA no respondió');\n  }\n\n  async terminarSesion() {\n    const d = this.state.demo;\n    if (!d || this.state.cerrandoSesion) return;\n    this.setState({ cerrandoSesion: true });\n    const sid = this._sess;\n    if (!sid) {\n      this.setState({ cerrandoSesion: false });\n      this.aviso('Todavía no registraste ninguna serie de esta sesión');\n      return;\n    }\n    const { data: prim } = await this.sb.from('workout_sessions').select('started_at').eq('id', sid).single();\n    const seg = prim && prim.started_at ? Math.max(60, Math.round((Date.now() - new Date(prim.started_at).getTime()) / 1000)) : null;\n    const { count } = await this.sb.from('set_logs').select('id', { count: 'exact', head: true }).eq('session_id', sid);\n    const { error } = await this.sb.from('workout_sessions').update({\n      status: 'completada', finished_at: new Date().toISOString(), duration_seconds: seg,\n      comment: String(this.state.comentarioSesion || '').trim() || null\n    }).eq('id', sid);\n    if (error) {\n      this.setState({ cerrandoSesion: false });\n      this.aviso('No se pudo cerrar la sesión: ' + error.message);\n      return;\n    }\n    this._sess = null;\n    this.limpiarBorradores(d);\n    this.setState({ cerrandoSesion: false, comentarioSesion: '', ejIdx: 0 });\n    if (this.state.perfil && this.state.perfil.role === 'alumno') await this.cargarComoAlumno(this.state.perfil);\n    else await this.cargarTodo();\n    this.aviso('Sesión completada · ' + (count || 0) + ' series guardadas. El historial anterior queda intacto.');\n  }\n\n  arrancar
