document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fc173fbb-ec8a-409d-be6b-e07a6984cc6e\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5e0b1807-c0d3-4cf3-bf80-9032d396a056\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8f3fa433-0815-4f56-a7ea-a76e2262fdea\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9048d6ea-ad78-425b-a173-d1a7a8e17264\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a9735015-16a9-43c3-9a7f-3c81f5e1a8b6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"1346720a-1d99-4158-8b10-abd4311827c5\"><\u002Fscript>\n<script src=\"5195806e-b7c9-4779-909e-4918e7f4d63c\"><\u002Fscript>\n<script src=\"945e8054-f06b-4f40-9e4b-3292d8db1846\"><\u002Fscript>\n<script src=\"e538a898-271e-4896-8ae6-66d4d25c942d\"><\u002Fscript>\n\n<style>\n:root, body {\n  --color-accent: #22d3c5;\n  --color-accent-100: #d9fbf6; --color-accent-200: #a6f4ea; --color-accent-300: #6ee9db;\n  --color-accent-400: #3fdccc; --color-accent-500: #22d3c5; --color-accent-600: #14b0a5;\n  --color-accent-700: #0f8b84; --color-accent-800: #0b6663; --color-accent-900: #0a4442;\n  --color-accent-2: #f6c344;\n  --color-accent-2-100: #fdf1d4; --color-accent-2-200: #fbe3a6; --color-accent-2-300: #f9d271;\n  --color-accent-2-400: #f7c953; --color-accent-2-500: #f6c344; --color-accent-2-600: #d09a1f;\n  --color-accent-2-700: #a1761a; --color-accent-2-800: #6f5215; --color-accent-2-900: #46360f;\n  --color-section: #08423f;\n  --tn-ok: #3ddc84; --tn-ok-900: #0e3a25;\n  --tn-warn: #f6c344; --tn-warn-900: #3d2f0e;\n  --tn-bad: #ff6161; --tn-bad-900: #3d1818;\n  /* La Ruta: un color por familia de hito, derivados en OKLCH sobre la cromacidad del accent */\n  --tn-fuerza: #9184d9; --tn-fuerza-300: #cfc9ee; --tn-fuerza-900: #2b2748;\n  --tn-constancia: oklch(0.72 0.095 192); --tn-constancia-300: oklch(0.86 0.055 192); --tn-constancia-900: oklch(0.30 0.045 192);\n  --tn-tecnica: oklch(0.76 0.105 72); --tn-tecnica-300: oklch(0.88 0.06 72); --tn-tecnica-900: oklch(0.31 0.05 72);\n}\nhtml, body { height: 100%; }\na { color: var(--color-accent-300); text-decoration: none; }\na:hover { color: var(--color-accent-200); text-decoration: underline; }\n@keyframes tn-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n@keyframes tn-pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }\n@keyframes tn-pop { 0% { transform: scale(.82); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }\n@keyframes tn-ring { to { transform: rotate(360deg); } }\n.tn-lift { transition: transform .16s ease, box-shadow .16s ease; }\n.tn-lift:hover { transform: translateY(-2px); }\n@media (max-width: 980px) {\n  .tn-shell { flex-direction: column !important; }\n  .tn-side { width: 100% !important; height: auto !important; position: static !important; }\n  .tn-navlist { flex-direction: row !important; overflow-x: auto; }\n  .tn-cols, .tn-cols-2, .tn-stats, .tn-mobile { grid-template-columns: 1fr !important; }\n  .tn-pad { padding-left: var(--space-4) !important; padding-right: var(--space-4) !important; }\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"tn-shell\" style=\"display:flex; align-items:stretch; min-height:100vh; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body)\">\n\n  <aside class=\"tn-side\" style=\"width:230px; flex:none; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:var(--space-6); padding:var(--space-6) var(--space-4); background:linear-gradient(180deg, #1b1d2d 0%, #161826 60%); box-shadow:inset -1px 0 0 var(--color-divider)\">\n    <div style=\"display:flex; align-items:center; gap:10px; padding:0 var(--space-2)\">\n      <div style=\"width:30px; height:30px; flex:none; border-radius:9px; border:1px solid var(--color-accent); display:grid; place-items:center; color:var(--color-accent); font-size:13px; font-weight:600\">TN<\u002Fdiv>\n      <div style=\"line-height:1.1\">\n        <div style=\"font-family:var(--font-heading); font-weight:500; font-size:15px\">Trainer Nico App<\u002Fdiv>\n        <div style=\"font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-500)\">Panel del coach<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav class=\"tn-navlist\" style=\"display:flex; flex-direction:column; gap:2px\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"8\">\n        <button type=\"button\" sc-camel-on-click=\"{{ n.go }}\" style=\"{{ n.style }}\" style-hover=\"background:color-mix(in srgb, var(--color-text) 7%, transparent)\">\n          {{ n.icon }}\n          <span>{{ n.label }}<\u002Fspan>\n          <sc-if value=\"{{ n.badge }}\" hint-placeholder-val=\"{{ false }}\">\n            <span class=\"tag tag-accent\" style=\"margin-left:auto; font-size:10px; padding:1px 7px\">{{ n.badge }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div style=\"margin-top:auto; display:flex; flex-direction:column; gap:var(--space-3)\">\n      <div style=\"display:flex; align-items:center; gap:7px; font-size:10px; color:var(--color-neutral-600); padding:0 var(--space-2)\">\n        <span style=\"{{ estadoPunto }}\"><\u002Fspan><span>{{ estadoConexion }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:9px; padding:var(--space-3); border-radius:var(--radius-md); background:var(--color-surface); box-shadow:var(--shadow-sm)\">\n        <div style=\"width:28px; height:28px; flex:none; border-radius:50%; background:var(--color-accent-800); color:var(--color-accent-100); display:grid; place-items:center; font-size:11px\">NM<\u002Fdiv>\n        <div style=\"min-width:0; flex:1\">\n          <div style=\"font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">Nico Martínez<\u002Fdiv>\n          <div style=\"font-size:10px; color:var(--color-neutral-500)\">Único administrador<\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ salir }}\" style=\"flex:none; font-size:11px; padding:4px 8px\">Salir<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1; min-width:0; display:flex; flex-direction:column\">\n    <header class=\"tn-pad\" style=\"display:flex; align-items:center; gap:var(--space-4); padding:var(--space-6) var(--space-8); position:sticky; top:0; z-index:20; backdrop-filter:blur(14px); background:color-mix(in srgb, #161826 88%, transparent); flex-wrap:wrap\">\n      <div style=\"min-width:0\">\n        <h4 style=\"margin:0\">{{ tituloVista }}<\u002Fh4>\n        <div style=\"font-size:12px; color:var(--color-neutral-500)\">{{ subtituloVista }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-left:auto; display:flex; align-items:center; gap:var(--space-3)\">\n        <div style=\"position:relative; display:flex; align-items:center\">\n          <input class=\"input\" placeholder=\"Buscar alumno, ejercicio, rutina…\" value=\"{{ buscar }}\" sc-camel-on-change=\"{{ onBuscar }}\" style=\"width:230px; padding-left:30px\">\n          <span style=\"position:absolute; left:9px; display:flex; color:var(--color-neutral-500)\">{{ iconLupa }}<\u002Fspan>\n        <\u002Fdiv>\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ irIA }}\">Método Nico<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div class=\"tn-pad\" style=\"flex:1; padding:0 var(--space-8) 72px\">\n\n      <sc-if value=\"{{ cargando }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; flex-direction:column; gap:var(--space-4)\">\n          <div style=\"{{ cargandoStyle }}\">{{ cargandoTexto }}<\u002Fdiv>\n          <sc-if value=\"{{ errorConexion }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card elev-sm\" style=\"padding:var(--space-6); gap:var(--space-2); max-width:520px\">\n              <div class=\"card-kicker\">No se pudo abrir la sesión<\u002Fdiv>\n              <p class=\"card-body\" style=\"line-height:1.55\">{{ errorConexion }}<\u002Fp>\n              <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ reintentar }}\" style=\"align-self:flex-start\">Reintentar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div class=\"tn-stats\" style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4)\">\n            <div style=\"height:104px; border-radius:var(--radius-md); background:var(--color-surface)\"><\u002Fdiv>\n            <div style=\"height:104px; border-radius:var(--radius-md); background:var(--color-surface)\"><\u002Fdiv>\n            <div style=\"height:104px; border-radius:var(--radius-md); background:var(--color-surface)\"><\u002Fdiv>\n            <div style=\"height:104px; border-radius:var(--radius-md); background:var(--color-surface)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- PANEL -->\n      <sc-if value=\"{{ esPanel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:var(--space-8); animation:tn-in .3s ease both\">\n          <div class=\"tn-stats\" style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:var(--space-4)\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div class=\"card elev-sm\" style=\"padding:var(--space-6); gap:var(--space-1)\">\n                <div class=\"card-kicker\">{{ k.label }}<\u002Fdiv>\n                <div style=\"{{ k.valorStyle }}\">{{ k.valor }}<\u002Fdiv>\n                <div style=\"font-size:11px; color:var(--color-neutral-500)\">{{ k.nota }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div class=\"tn-cols\" style=\"display:grid; grid-template-columns:1.45fr 1fr; gap:var(--space-8); align-items:start\">\n            <div style=\"display:flex; flex-direction:column; gap:var(--space-8); min-width:0\">\n              <sc-if value=\"{{ hayVivo }}\" hint-placeholder-val=\"{{ false }}\">\n                <section>\n                  <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:var(--space-4)\">\n                    <span style=\"width:7px; height:7px; border-radius:50%; background:var(--color-accent); animation:tn-pulse 1.4s ease-in-out infinite\"><\u002Fspan>\n                    <h6 class=\"text-muted\" style=\"margin:0\">Entrenando ahora<\u002Fh6>\n                    <span style=\"margin-left:auto; font-size:11px; color:var(--color-neutral-500)\">{{ vivoLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:var(--space-2)\">\n                    <sc-for list=\"{{ vivoLista }}\" as=\"v\" hint-placeholder-count=\"2\">\n                      <div class=\"card elev-sm\" style=\"flex-direction:row; align-items:center; gap:var(--space-3); padding:var(--space-4) var(--space-6); flex-wrap:wrap; box-shadow:inset 0 0 0 1px var(--color-accent-800), var(--shadow-sm)\">\n                        <div style=\"width:34px; height:34px; flex:none; border-radius:50%; background:var(--color-accent-800); color:var(--color-accent-100); display:grid; place-items:center; font-size:12px\">{{ v.iniciales }}<\u002Fdiv>\n                        <div style=\"min-width:0; flex:1\">\n                          <div style=\"font-size:14px\">{{ v.nombre }}<\u002Fdiv>\n                          <div style=\"font-size:11px; color:var(--color-neutral-500)\">{{ v.detalle }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <span class=\"tag tag-accent\" style=\"font-size:10px\">{{ v.series }}<\u002Fspan>\n                        <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ v.mirar }}\">Mirar la sesión<\u002Fbutton>\n                        <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ v.escribir }}\">Escribirle<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n           <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ fichaSinProg }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:12px; color:var(--color-neutral-500); line-height:1.5\">Todavía no tiene rutina. Asignale una de las 100 armadas o armásela desde cero en el editor.<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; border-top:1px solid var(--color-divider); padding-top:var(--space-3)\">\n                      <span style=\"font-size:11px; color:{{ fichaGuardadoColor }}\">{{ fichaEstadoGuardado }}<\u002Fspan>\n                      <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ fichaPublicar }}\" style=\"margin-left:auto\">Publicar cambios<\u002Fbutton>\n                      <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ irRutinas }}\">Abrir en el editor<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px; color:var(--color-neutral-600); line-height:1.5\">Lo que tocás acá se guarda solo, más o menos un segundo después. “Publicar” es lo que hace que el alumno lo vea en su app.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ fichaEsPlan }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex; flex-direction:column; gap:var(--space-3); animation:tn-in .2s ease both\">\n                    <div style=\"display:flex; align-items:baseline; gap:var(--space-2); flex-wrap:wrap\">\n                      <div style=\"font-size:14px\">{{ fichaPlanNombre }}<\u002Fdiv>\n                      <span class=\"{{ fichaPlanTag }}\" style=\"margin-left:auto\">{{ fichaPlanEstado }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex; gap:var(--space-4); flex-wrap:wrap\">\n                      <sc-for list=\"{{ fichaPlanMacros }}\" as=\"fm\" hint-placeholder-count=\"4\">\n                        <div>\n                          <div style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-neutral-600)\">{{ fm.k }}<\u002Fdiv>\n                          <div style=\"font-family:var(--font-heading); font-size:19px; color:{{ fm.color }}\">{{ fm.v }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ fichaPlanComidas }}\" as=\"fc\" hint-placeholder-count=\"4\">\n                      <div style=\"padding:var(--space-3); border-radius:var(--radius-md); background:var(--color-bg); box-shadow:inset 0 0 0 1px var(--color-divider)\">\n                        <div style=\"display:flex; align-items:baseline; gap:6px; margin-bottom:5px\">\n                          <span style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-accent-300)\">{{ fc.nombre }}<\u002Fspan>\n                          <span style=\"margin-left:auto; font-size:10px; color:var(--color-neutral-600)\">{{ fc.kcal }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"font-size:12px; color:var(--color-neutral-400); line-height:1.45\">{{ fc.detalle }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ fichaSinPlan }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:12px; color:var(--color-neutral-500); line-height:1.5\">Todavía no tiene plan de alimentación. Armáselo con la encuesta o en blanco desde Nutrición.<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <button type=\"button\" class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ irNutricion }}\">Abrir y modificar la alimentación<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ fichaEsPeso }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex; flex-direction:column; gap:var(--space-3); animation:tn-in .2s ease both\">\n                    <div style=\"display:flex; align-items:flex-end; gap:5px; height:78px\">\n                      <sc-for list=\"{{ fichaPesoBarras }}\" as=\"b\" hint-placeholder-count=\"8\"><div title=\"{{ b.title }}\" style=\"{{ b.style }}\"><\u002Fdiv><\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px; color:var(--color-neutral-500)\">{{ fichaPesoResumen }}<\u002Fdiv>\n                    <div style=\"display:flex; flex-direction:column; gap:2px\">\n                      <sc-for list=\"{{ fichaPesoHistorial }}\" as=\"ph\" hint-placeholder-count=\"6\">\n                        <div style=\"display:flex; gap:8px; align-items:baseline; font-size:13px; padding:5px 0; border-top:1px solid var(--color-divider)\">\n                          <span style=\"flex:1; color:var(--color-neutral-400)\">{{ ph.fecha }}<\u002Fspan>\n                          <span style=\"font-variant-numeric:tabular-nums\">{{ ph.kg }} kg<\u002Fspan>\n                          <span style=\"{{ ph.deltaStyle }}\">{{ ph.delta }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ fichaSinPeso }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:12px; color:var(--color-neutral-500); line-height:1.5\">Todavía no cargó ningún peso. Lo carga él desde su app, en la pestaña Progreso.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"display:flex; gap:var(--space-2); flex-wrap:wrap; border-top:1px solid var(--color-divider); padding-top:var(--space-4)\">\n                  <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ficha.asignar }}\">Asignar rutina armada<\u002Fbutton>\n                  <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ficha.chatear }}\">Mensajes<\u002Fbutton>\n                  <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ficha.analizar }}\">{{ ficha.analizarLabel }}<\u002Fbutton>\n                  <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ficha.suspender }}\" style=\"{{ ficha.suspenderStyle }}\">{{ ficha.suspenderLabel }}<\u002Fbutton>\n                  <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ ficha.borrar }}\" style=\"color:var(--color-neutral-500)\">{{ ficha.borrarLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"font-size:11px; color:var(--color-neutral-600); line-height:1.5\">{{ ficha.suspenderNota }}<\u002Fdiv>\n                <sc-if value=\"{{ ficha.bajaAbierta }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-4); border-radius:var(--radius-md); background:var(--color-surface); box-shadow:inset 0 0 0 1px var(--color-neutral-800)\">\n                    <div style=\"font-size:12px; color:var(--color-neutral-400); line-height:1.5\">Se archiva la ficha y deja de poder entrar. El historial de series y los planes se conservan.<\u002Fdiv>\n                    <input class=\"input\" value=\"{{ ficha.bajaTexto }}\" sc-camel-on-change=\"{{ ficha.onBajaTexto }}\" placeholder=\"{{ ficha.bajaPide }}\">\n                    <div style=\"display:flex; gap:var(--space-2)\">\n                      <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ ficha.borrar }}\" style=\"flex:1\">Confirmar baja<\u002Fbutton>\n                      <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ ficha.cancelarBaja }}\">Cancelar<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Faside>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- PLANTILLAS -->\n      <sc-if value=\"{{ esPlantillas }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:var(--space-6); animation:tn-in .3s ease both\">\n          <div class=\"card elev-sm\" style=\"flex-direction:row; align-items:center; gap:var(--space-4); padding:var(--space-6); flex-wrap:wrap\">\n            <div>\n              <div class=\"card-kicker\">Biblioteca de rutinas<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading); font-size:19px\">{{ tplTotal }} rutinas armadas, ninguna repetida<\u002Fdiv>\n              <div style=\"font-size:11px; color:var(--color-neutral-500); max-width:76ch; line-height:1.5\">Divididas por días por semana, nivel y enfoque, con prioridad en tren inferior y glúteo. Incluyen superseries, dropsets y rest-pause donde corresponde. Asignar crea un borrador nuevo: no toca la rutina que el alumno está haciendo.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-left:auto; display:flex; align-items:center; gap:var(--space-2)\">\n              <span style=\"font-size:11px; color:var(--color-neutral-500)\">Asignar a<\u002Fspan>\n              <sc-raw-select class=\"input\" value=\"{{ alumnoSel }}\" sc-camel-on-change=\"{{ cambiarAlumno }}\" style=\"width:200px\">\n                <sc-for list=\"{{ opcionesAlumno }}\" as=\"o\" hint-placeholder-count=\"10\">\n                  <option value=\"{{ o.id }}\">{{ o.nombre }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; gap:var(--space-4); flex-wrap:wrap\">\n            <sc-for list=\"{{ tplFiltros }}\" as=\"ff\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; flex-direction:column; gap:6px; min-width:0\">\n                <span style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-neutral-600)\">{{ ff.titulo }}<\u002Fspan>\n                <div style=\"display:flex; gap:6px; flex-wrap:wrap\">\n                  <sc-for list=\"{{ ff.opciones }}\" as=\"op\" hint-placeholder-count=\"5\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ op.set }}\" style=\"{{ op.style }}\" style-hover=\"border-color:var(--color-accent)\">{{ op.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"margin-left:auto; align-self:flex-end; font-size:12px; color:var(--color-neutral-500)\">{{ tplConteo }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:var(--space-4)\">\n            <sc-for list=\"{{ plantillas }}\" as=\"t\" hint-placeholder-count=\"9\">\n              <div class=\"card elev-sm\" style=\"padding:var(--space-6); gap:var(--space-3); animation:tn-in .2s ease both\">\n                <div style=\"display:flex; gap:6px; flex-wrap:wrap\">\n                  <span class=\"tag tag-accent\">{{ t.focus }}<\u002Fspan>\n                  <span class=\"tag tag-neutral\">{{ t.level }}<\u002Fspan>\n                  <span class=\"tag tag-outline\">{{ t.dias }}<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"card-title\" style=\"font-size:15px\">{{ t.split }}<\u002Fdiv>\n                <p class=\"card-body\" style=\"line-height:1.5\">{{ t.description }}<\u002Fp>\n                <div style=\"font-size:11px; color:var(--color-neutral-600)\">{{ t.meta }}<\u002Fdiv>\n                <div style=\"display:flex; gap:var(--space-2); align-items:center; flex-wrap:wrap\">\n                  <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ t.ver }}\">{{ t.verLabel }}<\u002Fbutton>\n                  <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ t.asignar }}\">{{ t.asignarLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-if value=\"{{ t.abierta }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex; flex-direction:column; gap:var(--space-3); border-top:1px solid var(--color-divider); padding-top:var(--space-3)\">\n                    <sc-for list=\"{{ t.dias_detalle }}\" as=\"dd\" hint-placeholder-count=\"3\">\n                      <div>\n                        <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-accent-300); margin-bottom:5px\">{{ dd.nombre }}<\u002Fdiv>\n                        <div style=\"display:flex; flex-direction:column; gap:2px\">\n                          <sc-for list=\"{{ dd.ejercicios }}\" as=\"ee\" hint-placeholder-count=\"5\">\n                            <div style=\"display:flex; gap:8px; font-size:12px\">\n                              <span style=\"flex:1; min-width:0\">{{ ee.nombre }}<\u002Fspan>\n                              <span style=\"color:var(--color-neutral-500)\">{{ ee.pauta }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- RUTINAS -->\n      <sc-if value=\"{{ esRutinas }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:var(--space-6); animation:tn-in .3s ease both\">\n          <div class=\"card elev-sm\" style=\"flex-direction:row; align-items:center; gap:var(--space-6); padding:var(--space-6); flex-wrap:wrap\">\n            <div>\n              <div class=\"card-kicker\">Programa<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading); font-size:19px\">{{ progNombre }}<\u002Fdiv>\n              <div style=\"font-size:11px; color:var(--color-neutral-500)\">{{ progMeta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:var(--space-2); margin-left:auto; flex-wrap:wrap; align-items:center\">\n              <sc-raw-select class=\"input\" value=\"{{ alumnoSel }}\" sc-camel-on-change=\"{{ cambiarAlumno }}\" style=\"width:190px\">\n                <sc-for list=\"{{ opcionesAlumno }}\" as=\"o\" hint-placeholder-count=\"10\">\n                  <option value=\"{{ o.id }}\">{{ o.nombre }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <sc-if value=\"{{ hayVariosProgramas }}\" hint-placeholder-val=\"{{ false }}\">\n                <sc-raw-select class=\"input\" value=\"{{ progSel }}\" sc-camel-on-change=\"{{ cambiarPrograma }}\" style=\"width:230px\">\n                  <sc-for list=\"{{ opcionesPrograma }}\" as=\"o\" hint-placeholder-count=\"2\">\n                    <option value=\"{{ o.id }}\">{{ o.nombre }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fsc-if>\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ abrirEncuestaRutina }}\" disabled=\"{{ sinAlumnos }}\">Armar con IA<\u002Fbutton>\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ nuevaRutina }}\" disabled=\"{{ sinAlumnos }}\">Rutina en blanco<\u002Fbutton>\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ duplicarDia }}\" disabled=\"{{ sinPrograma }}\">Duplicar día<\u002Fbutton>\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ guardarComoPlantilla }}\" disabled=\"{{ sinPrograma }}\">Guardar como plantilla<\u002Fbutton>\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ abrirVersiones }}\" disabled=\"{{ sinPrograma }}\">{{ versionesLabel }}<\u002Fbutton>\n              <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ publicarRutina }}\" disabled=\"{{ sinPrograma }}\">{{ publicarLabel }}<\u002Fbutton>\n              <span style=\"font-size:11px; color:{{ estadoGuardadoColor }}; white-space:nowrap\">{{ estadoGuardado }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ versDlgAbierto }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"card elev-sm\" style=\"padding:var(--space-4) var(--space-6); gap:var(--space-2); animation:tn-in .2s ease both\">\n                <div style=\"display:flex; align-items:baseline; gap:var(--space-2)\">\n                  <h6 class=\"text-muted\" style=\"margin:0\">Versiones guardadas<\u002Fh6>\n                  <span style=\"margin-left:auto; font-size:11px; color:var(--color-neutral-600)\">Cada publicación guarda una versión. Restaurar no borra nada.<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ versionesLista }}\" as=\"vs\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex; align-items:center; gap:var(--space-3); font-size:12px; padding:6px 0; border-top:1px solid var(--color-divider)\">\n                    <span class=\"tag tag-outline\" style=\"font-size:10px; flex:none\">{{ vs.label }}<\u002Fspan>\n                    <span style=\"flex:1; min-width:0; color:var(--color-neutral-400)\">{{ vs.detalle }}<\u002Fspan>\n                    <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ vs.restaurar }}\" style=\"font-size:11px\">{{ vs.boton }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ sinVersiones }}\" hint-placeholder-val=\"{{ true       <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr 1fr 22px; gap:4px; align-items:center\">\n                                <input class=\"input\" value=\"{{ it.kcalDraft }}\" sc-camel-on-change=\"{{ it.onKcal }}\" inputmode=\"decimal\" placeholder=\"kcal\" title=\"Calorías\" style=\"font-size:11px; padding:4px 4px; text-align:center\">\n                                <input class=\"input\" value=\"{{ it.protDraft }}\" sc-camel-on-change=\"{{ it.onProt }}\" inputmode=\"decimal\" placeholder=\"P g\" title=\"Proteína\" style=\"font-size:11px; padding:4px 4px; text-align:center\">\n                                <input class=\"input\" value=\"{{ it.carbDraft }}\" sc-camel-on-change=\"{{ it.onCarb }}\" inputmode=\"decimal\" placeholder=\"C g\" title=\"Carbohidratos\" style=\"font-size:11px; padding:4px 4px; text-align:center\">\n                                <input class=\"input\" value=\"{{ it.fatDraft }}\" sc-camel-on-change=\"{{ it.onFat }}\" inputmode=\"decimal\" placeholder=\"G g\" title=\"Grasas\" style=\"font-size:11px; padding:4px 4px; text-align:center\">\n                                <span><\u002Fspan>\n                              <\u002Fdiv>\n                              <input class=\"input\" value=\"{{ it.notaDraft }}\" sc-camel-on-change=\"{{ it.onNota }}\" placeholder=\"Medida casera o aclaración\" style=\"font-size:11px; padding:4px 8px\">\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                          <div style=\"display:flex; gap:8px; align-items:baseline; font-size:10px; color:var(--color-neutral-500)\">\n                            <span style=\"flex:1\">{{ o.macros }}<\u002Fspan>\n                            <span style=\"color:{{ o.desvioColor }}\">{{ o.desvio }}<\u002Fspan>\n                          <\u002Fdiv>\n                          <div style=\"display:flex; gap:5px; flex-wrap:wrap\">\n                            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ o.buscarAlimento }}\" style=\"flex:1; font-size:12px\">Elegir de la lista<\u002Fbutton>\n                            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ o.agregarAlimento }}\" style=\"font-size:12px\">A mano<\u002Fbutton>\n                            <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ o.hacerDefault }}\" style=\"font-size:12px\">Predeterminada<\u002Fbutton>\n                            <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ o.borrarOpcion }}\" style=\"color:var(--tn-bad); font-size:12px\">Quitar<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsection>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ editandoPlan }}\" hint-placeholder-val=\"{{ false }}\">\n                <button type=\"button\" class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ agregarComida }}\">+ Agregar comida<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hayPlan }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; flex-direction:column; gap:var(--space-4); min-width:0\">\n              <div class=\"card elev-sm\" style=\"padding:var(--space-6); gap:var(--space-4)\">\n                <h6 class=\"text-muted\" style=\"margin:0\">Lista de compras de la semana<\u002Fh6>\n                <sc-for list=\"{{ compras }}\" as=\"cat\" hint-placeholder-count=\"4\">\n                  <div>\n                    <div style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:5px\">{{ cat.nombre }}<\u002Fdiv>\n                    <div style=\"display:flex; flex-direction:column; gap:3px\">\n                      <sc-for list=\"{{ cat.items }}\" as=\"ci\" hi
