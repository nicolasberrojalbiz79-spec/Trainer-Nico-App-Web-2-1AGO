ne; width:280px\">\n                <sc-for list=\"{{ rutasOpciones }}\" as=\"ro\" hint-placeholder-count=\"3\">\n                  <option value=\"{{ ro.id }}\">{{ ro.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ rutasHayBorrador }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card elev-lg\" style=\"padding:var(--space-6); gap:var(--space-4); box-shadow:inset 0 0 0 1px var(--color-accent-700), var(--shadow-lg)\">\n              <div style=\"display:flex; align-items:flex-start; gap:var(--space-3); flex-wrap:wrap\">\n                <div style=\"flex:1; min-width:240px\">\n                  <span class=\"tag tag-accent\" style=\"font-size:10px\">Propuesta sin aprobar<\u002Fspan>\n                  <div style=\"font-family:var(--font-heading); font-size:20px; margin-top:8px\">{{ rutaBorradorNombre }}<\u002Fdiv>\n                  <div style=\"font-size:12px; color:var(--color-neutral-500)\">{{ rutaBorradorAlumno }} · {{ rutaBorradorNivel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:8px\">\n                  <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ descartarRutaBorrador }}\">Descartar<\u002Fbutton>\n                  <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ aprobarRutaBorrador }}\">Aprobar y activar<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p class=\"card-body\" style=\"margin:0; line-height:1.6\">{{ rutaBorradorRazon }}<\u002Fp>\n              <div style=\"display:flex; flex-direction:column; gap:var(--space-3)\">\n                <sc-for list=\"{{ rutaBorradorHitos }}\" as=\"bh\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex; flex-direction:column; gap:8px; padding:var(--space-4); border:1px solid var(--color-divider); border-radius:var(--radius-md)\">\n                    <div style=\"display:flex; align-items:center; gap:10px\">\n                      <span style=\"{{ bh.tagStyle }}\">{{ bh.familia }}<\u002Fspan>\n                      <input class=\"input\" value=\"{{ bh.titulo }}\" sc-camel-on-change=\"{{ bh.onTitulo }}\" style=\"flex:1; height:34px; min-height:34px\">\n                      <input class=\"input\" value=\"{{ bh.metaTxt }}\" sc-camel-on-change=\"{{ bh.onMeta }}\" style=\"flex:none; width:110px; height:34px; min-height:34px; text-align:center; font-variant-numeric:tabular-nums\">\n                      <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ bh.borrar }}\" style=\"flex:none; font-size:12px\">Quitar<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px; color:var(--color-neutral-500); line-height:1.5\">{{ bh.detalle }}<\u002Fdiv>\n                    <div style=\"font-size:12px; color:var(--color-neutral-400); line-height:1.55; padding-left:11px; border-left:1px solid var(--color-accent-800)\">{{ bh.razonamiento }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:var(--space-4)\">\n            <div class=\"card elev-sm\" style=\"padding:var(--space-5); gap:var(--space-3)\">\n              <div style=\"display:flex; align-items:center; gap:8px\">\n                <span style=\"width:7px; height:7px; border-radius:50%; background:var(--tn-ok); animation:tn-pulse 1.8s infinite\"><\u002Fspan>\n                <div style=\"font-family:var(--font-heading); font-size:15px\">Desbloqueados hoy<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ rutasHayHoy }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex; flex-direction:column\">\n                  <sc-for list=\"{{ rutasHoy }}\" as=\"hh\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--color-divider)\">\n                      <span style=\"{{ hh.punto }}\"><\u002Fspan>\n                      <span style=\"flex:none; font-size:13px; color:var(--color-neutral-300)\">{{ hh.alumno }}<\u002Fspan>\n                      <span style=\"flex:1; min-width:0; font-size:13px\">{{ hh.titulo }}<\u002Fspan>\n                      <span style=\"flex:none; font-size:11px; color:var(--color-neutral-600); font-variant-numeric:tabular-nums\">{{ hh.hora }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ rutasSinHoy }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px; color:var(--color-neutral-600)\">Todavía nadie desbloqueó nada hoy.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div class=\"card elev-sm\" style=\"padding:var(--space-5); gap:var(--space-3)\">\n              <div style=\"font-family:var(--font-heading); font-size:15px\">A punto de caer<\u002Fdiv>\n              <sc-if value=\"{{ rutasHayPorCaer }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex; flex-direction:column; gap:var(--space-3)\">\n                  <sc-for list=\"{{ rutasPorCaer }}\" as=\"pc\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex; flex-direction:column; gap:5px\">\n                      <div style=\"display:flex; align-items:baseline; gap:8px\">\n                        <span style=\"flex:none; font-size:12.5px; color:var(--color-neutral-300)\">{{ pc.alumno }}<\u002Fspan>\n                        <span style=\"flex:1; min-width:0; font-size:12.5px\">{{ pc.titulo }}<\u002Fspan>\n                        <span style=\"flex:none; font-size:11px; color:var(--color-neutral-500); font-variant-numeric:tabular-nums\">{{ pc.pct }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"height:3px; border-radius:99px; background:var(--color-neutral-900); overflow:hidden\"><div style=\"{{ pc.barra }}\"><\u002Fdiv><\u002Fdiv>\n                      <div style=\"display:flex; align-items:center; gap:8px\">\n                        <span style=\"flex:1; font-size:11px; color:var(--color-neutral-600)\">{{ pc.falta }}<\u002Fspan>\n                        <sc-if value=\"{{ pc.esTecnica }}\" hint-placeholder-val=\"{{ false }}\">\n                          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ pc.validar }}\" style=\"flex:none; font-size:11px\">Validar técnica<\u002Fbutton>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ rutasSinPorCaer }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px; color:var(--color-neutral-600)\">Ningún hito por encima del 70% en este momento.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ rutasHayEstancados }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card elev-sm\" style=\"padding:var(--space-5); gap:var(--space-3); box-shadow:inset 0 0 0 1px var(--tn-warn-900), var(--shadow-sm)\">\n              <div style=\"font-family:var(--font-heading); font-size:15px; color:var(--tn-warn)\">Estancados<\u002Fdiv>\n              <div style=\"font-size:12px; color:var(--color-neutral-500)\">Sin conquistar un hito hace más de tres semanas. Puede ser fatiga acumulada, un salto demasiado grande o desmotivación.<\u002Fdiv>\n              <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n                <sc-for list=\"{{ rutasEstancados }}\" as=\"es\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ es.verFicha }}\" class=\"btn btn-secondary\" style=\"font-size:12px\">{{ es.nombre }} · {{ es.ultimo }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div class=\"card elev-sm\" style=\"padding:var(--space-5); gap:var(--space-3)\">\n            <div style=\"font-family:var(--font-heading); font-size:15px\">Todo el plantel<\u002Fdiv>\n            <sc-raw-table class=\"table\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Alumno<\u002Fsc-raw-th><sc-raw-th>Etapa<\u002Fsc-raw-th><sc-raw-th>Nivel<\u002Fsc-raw-th><sc-raw-th style=\"width:170px\">Avance<\u002Fsc-raw-th><sc-raw-th>Hitos<\u002Fsc-raw-th><sc-raw-th>Último<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ rutasTabla }}\" as=\"rt\" hint-placeholder-count=\"4\">\n                  <sc-raw-tr>\n                    <sc-raw-td><button type=\"button\" sc-camel-on-click=\"{{ rt.verFicha }}\" style=\"border:0; background:transparent; color:inherit; font:inherit; cursor:pointer; padding:0\">{{ rt.nombre }}<\u002Fbutton><\u002Fsc-raw-td>\n                    <sc-raw-td style=\"color:var(--color-neutral-500)\">{{ rt.etapa }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"color:var(--color-neutral-500)\">{{ rt.nivel }}<\u002Fsc-raw-td>\n                    <sc-raw-td>\n                      <div style=\"display:flex; align-items:center; gap:9px\">\n                        <div style=\"flex:1; height:4px; border-radius:99px; background:var(--color-neutral-900); overflow:hidden\"><div style=\"{{ rt.barra }}\"><\u002Fdiv><\u002Fdiv>\n                        <span style=\"flex:none; font-size:11px; color:var(--color-neutral-500); font-variant-numeric:tabular-nums\">{{ rt.pct }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-raw-td>\n                    <sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ rt.marcador }}<\u002Fsc-raw-td>\n                    <sc-raw-td><span style=\"{{ rt.ultimoStyle }}\">{{ rt.ultimo }}<\u002Fspan><\u002Fsc-raw-td>\n                    <sc-raw-td>\n                      <sc-if value=\"{{ rt.sinRuta }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ rt.proponer }}\" style=\"font-size:11px\">Proponer<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- MÉTODO NICO -->\n      <sc-if value=\"{{ esIA }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:var(--space-6); animation:tn-in .3s ease both\">\n        <div class=\"card elev-sm\" style=\"padding:var(--space-6); gap:var(--space-4)\">\n          <div style=\"display:flex; align-items:flex-start; gap:var(--space-4); flex-wrap:wrap\">\n            <div style=\"flex:1; min-width:260px\">\n              <div class=\"card-kicker\">Qué es el Método Nico<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading); font-size:20px; margin-bottom:6px\">Tu criterio, escrito para que la IA lo copie<\u002Fdiv>\n              <p class=\"card-body\" style=\"line-height:1.6; max-width:62ch\">No es un chat suelto: es el perfil con el que la IA arma todo. Guarda los ejercicios que más usás, los techos de volumen que respetás por grupo muscular y los criterios que se repiten en tus rutinas. Cada vez que pedís una rutina, un plan de comidas o una revisión, ese perfil se manda como instrucción, así lo que te propone se parece a lo que hacés vos y no a un manual genérico.<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ recalcularMetodo }}\" style=\"flex:none\">{{ recalcularMetodoLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:var(--space-3)\">\n            <sc-for list=\"{{ metodoUsos }}\" as=\"mu\" hint-placeholder-count=\"4\">\n              <div style=\"padding:var(--space-4); border-radius:var(--radius-md); background:var(--color-bg); box-shadow:inset 0 0 0 1px var(--color-divider)\">\n                <div style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:{{ mu.color }}; margin-bottom:4px\">{{ mu.donde }}<\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--color-neutral-300); line-height:1.5\">{{ mu.que }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tn-cols\" style=\"display:grid; grid-template-columns:1fr 1.15fr; gap:var(--space-8); align-items:start\">\n          <div class=\"card elev-sm\" style=\"padding:var(--space-6); gap:var(--space-4)\">\n            <div>\n              <div class=\"card-kicker\">Perfil interno<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading); font-size:19px\">Lo que la IA aprendió de cómo entrenás<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex; font-size:12px; margin-bottom:5px\"><span style=\"flex:1\">Confianza del modelo<\u002Fspan><span style=\"color:var(--color-accent-300)\">{{ metodoConfianza }}<\u002Fspan><\u002Fdiv>\n              <div style=\"height:4px; border-radius:99px; background:var(--color-neutral-900); overflow:hidden\"><div style=\"{{ metodoBarra }}\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-size:11px; color:var(--color-neutral-600); margin-top:6px\">{{ metodoBase }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <h6 class=\"text-muted\" style=\"margin-bottom:var(--space-2)\">Ejercicios que más usás<\u002Fh6>\n              <div style=\"display:flex; flex-wrap:wrap; gap:6px\">\n                <sc-for list=\"{{ favoritos }}\" as=\"f\" hint-placeholder-count=\"8\"><span class=\"tag tag-accent\">{{ f }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <h6 class=\"text-muted\" style=\"margin-bottom:var(--space-2)\">Criterios detectados<\u002Fh6>\n              <ul style=\"margin:0; padding-left:16px; display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--color-neutral-300)\">\n                <sc-for list=\"{{ criterios }}\" as=\"c\" hint-placeholder-count=\"6\"><li>{{ c }}<\u002Fli><\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div>\n              <h6 class=\"text-muted\" style=\"margin-bottom:var(--space-2)\">Lo que aprendió de tus datos<\u002Fh6>\n              <sc-if value=\"{{ hayAprendidos }}\" hint-placeholder-val=\"{{ false }}\">\n                <ul style=\"margin:0; padding-left:16px; display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--color-accent-200)\">\n                  <sc-for list=\"{{ aprendidos }}\" as=\"ap\" hint-placeholder-count=\"4\"><li>{{ ap }}<\u002Fli><\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sinAprendidos }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:12px; color:var(--color-neutral-500); line-height:1.5\">Todavía no hay suficientes decisiones tuyas. Aprobá o descartá propuestas y publicá rutinas: cada una queda acá como criterio.<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:grid; grid-template-columns:repeat(2, 1fr); gap:var(--space-2); margin-top:var(--space-3)\">\n                <sc-for list=\"{{ metodoSellos }}\" as=\"ms\" hint-placeholder-count=\"4\">\n                  <div style=\"padding:var(--space-3); border-radius:var(--radius-md); background:var(--color-bg); box-shadow:inset 0 0 0 1px var(--color-divider)\">\n                    <div style=\"font-family:var(--font-heading); font-size:19px\">{{ ms.valor }}<\u002Fdiv>\n                    <div style=\"font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-neutral-600)\">{{ ms.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hayProgresion }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <h6 class=\"text-muted\" style=\"margin-bottom:var(--space-2)\">Progresión real por ejercicio<\u002Fh6>\n                <div style=\"display:flex; flex-direction:column; gap:2px\">\n                  <sc-for list=\"{{ progresionLista }}\" as=\"pr\" hint-placeholder-count=\"6\">\n                    <div style=\"display:flex; align-items:baseline; gap:8px; font-size:12px; padding:5px 0; border-top:1px solid var(--color-divider)\">\n                      <span style=\"flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ pr.ejercicio }}<\u002Fspan>\n                      <span style=\"color:var(--color-accent-200); font-variant-numeric:tabular-nums\">+{{ pr.salto }} kg<\u002Fspan>\n                      <span style=\"font-size:10px; color:var(--color-neutral-600)\">{{ pr.base }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hayDecisiones }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <h6 class=\"text-muted\" style=\"margin-bottom:var(--space-2)\">Tus últimas decisiones<\u002Fh6>\n                <div style=\"display:flex; flex-direction:column; gap:var(--space-2)\">\n                  <sc-for list=\"{{ decisiones }}\" as=\"dc\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex; gap:8px; align-items:flex-start; font-size:12px; line-height:1.45\">\n                      <span class=\"{{ dc.tagClass }}\" style=\"font-size:9px; flex:none\">{{ dc.estado }}<\u002Fspan>\n                      <span style=\"flex:1; min-width:0; color:var(--color-neutral-300)\">{{ dc.titulo }}<span style=\"color:var(--color-neutral-600)\">{{ dc.motivo }}<\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ hayMolestias }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <h6 class=\"text-muted\" style=\"margin-bottom:var(--space-2)\">Molestias reportadas<\u002Fh6>\n                <div style=\"display:flex; flex-direction:column; gap:var(--space-2)\">\n                  <sc-for list=\"{{ molestiasLista }}\" as=\"mo\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex; gap:8px; align-items:center; font-size:12px\">\n                      <span style=\"flex:1; min-width:0\">{{ mo.texto }}<\u002Fspan>\n                      <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ mo.cerrar }}\" style=\"font-size:11px; flex:none\">Resolver<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div>\n              <h6 class=\"text-muted\" style=\"margin-bottom:var(--space-2)\">Techo semanal por grupo<\u002Fh6>\n              <div style=\"display:flex; flex-wrap:wrap; gap:6px\">\n                <sc-for list=\"{{ topes }}\" as=\"t\" hint-placeholder-count=\"9\"><span class=\"tag tag-outline\">{{ t }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; gap:var(--space-4); min-width:0\">\n            <div class=\"card elev-sm\" style=\"padding:var(--space-6); gap:var(--space-3)\">\n              <h6 class=\"text-muted\" style=\"margin:0\">Pedile algo a la IA<\u002Fh6>\n              <div style=\"display:flex; gap:var(--space-2); flex-wrap:wrap\">\n                <sc-for list=\"{{ prompts }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ p.usar }}\" style=\"font-size:12px\">{{ p.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:var(--space-2); flex-wrap:wrap\">\n                <input class=\"input\" placeholder=\"Ej: revisá el bloque de Julián y proponé una descarga\" value=\"{{ promptTexto }}\" sc-camel-on-change=\"{{ onPrompt }}\" style=\"flex:1; min-width:200px\">\n                <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ generar }}\" style=\"flex:none\">{{ generarLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-size:11px; color:var(--color-neutral-600)\">La IA propone. Nunca modifica una rutina publicada sin tu aprobación, y sólo usa los {{ totalEjercicios }} ejercicios de tu biblioteca.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <h6 class=\"text-muted\" style=\"margin:0\">Cola de aprobación · {{ pendientesLabel }}<\u002Fh6>\n            <div style=\"display:flex; flex-direction:column; gap:var(--space-3)\">\n              <sc-for list=\"{{ sugerencias }}\" as=\"g\" hint-placeholder-count=\"5\">\n                <div class=\"card elev-sm\" style=\"padding:var(--space-6); gap:var(--space-3); animation:tn-in .25s ease both\">\n                  <div style=\"display:flex; align-items:center; gap:var(--space-2)\">\n                    <span class=\"tag tag-outline\">{{ g.kind }}<\u002Fspan>\n                    <span style=\"font-size:11px; color:var(--color-neutral-500)\">{{ g.alumno }}<\u002Fspan>\n                    <span style=\"margin-left:auto; font-size:10px; color:var(--color-neutral-600)\">{{ g.cuando }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div class=\"card-title\" style=\"font-size:15px\">{{ g.title }}<\u002Fdiv>\n                  <p class=\"card-body\" style=\"line-height:1.5\">{{ g.detail }}<\u002Fp>\n                  <div style=\"font-size:10px; color:var(--color-neutral-600); border-top:1px solid var(--color-divider); padding-top:var(--space-2)\">Base: {{ g.rationale }}<\u002Fdiv>\n                  <input class=\"input\" value=\"{{ g.motivo }}\" sc-camel-on-change=\"{{ g.onMotivo }}\" placeholder=\"Por qué la aprobás o la descartás (queda como criterio tuyo)\" style=\"font-size:12px\">\n                  <div style=\"display:flex; gap:var(--space-2)\">\n                    <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ g.aprobar }}\">Aprobar<\u002Fbutton>\n                    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ g.descartar }}\">Descartar<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- MENSAJES -->\n      <sc-if value=\"{{ esChat }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"tn-cols\" style=\"display:grid; grid-template-columns:minmax(240px, 300px) minmax(0, 1fr); gap:var(--space-6); align-items:start; animation:tn-in .3s ease both\">\n          <div class=\"card elev-sm\" style=\"padding:var(--space-3); gap:2px; max-height:70vh; overflow:auto\">\n            <sc-for list=\"{{ hilos }}\" as=\"h\" hint-placeholder-count=\"8\">\n              <button type=\"button\" sc-camel-on-click=\"{{ h.abrir }}\" style=\"{{ h.style }}\" style-hover=\"background:color-mix(in srgb, var(--color-text) 7%, transparent)\">\n                <span style=\"width:30px; height:30px; flex:none; border-radius:50%; background:var(--color-neutral-800); color:var(--color-neutral-200); display:grid; place-items:center; font-size:11px\">{{ h.iniciales }}<\u002Fspan>\n                <span style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; text-align:left\">\n                  <span style=\"font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ h.nombre }}<\u002Fspan>\n                  <span style=\"font-size:11px; color:var(--color-neutral-600); white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">{{ h.ultimo }}<\u002Fspan>\n                <\u002Fspan>\n                <sc-if value=\"{{ h.sinLeer }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span class=\"tag tag-accent\" style=\"font-size:10px; padding:1px 7px\">{{ h.sinLeer }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div class=\"card elev-sm\" style=\"padding:0; overflow:hidden; gap:0; height:70vh\">\n            <sc-if value=\"{{ hayChat }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; flex-direction:column; height:100%\">\n                <div style=\"display:flex; align-items:center; gap:10px; padding:var(--space-4) var(--space-6); box-shadow:inset 0 -1px 0 var(--color-divider)\">\n                  <div style=\"width:32px; height:32px; flex:none; border-radius:50%; background:var(--color-accent-800); color:var(--color-accent-100); display:grid; place-items:center; font-size:12px\">{{ chatIniciales }}<\u002Fdiv>\n                  <div style=\"min-width:0; flex:1\">\n                    <div style=\"font-size:14px\">{{ chatNombre }}<\u002Fdiv>\n                    <div style=\"font-size:11px; color:var(--color-neutral-500)\">{{ chatEstado }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ chatWhatsapp }}\">WhatsApp<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"flex:1; overflow:auto; display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-6)\">\n                  <sc-for list=\"{{ chatMsgs }}\" as=\"m\" hint-placeholder-count=\"5\">\n                    <div style=\"{{ m.fila }}\">\n                      <div style=\"{{ m.burbuja }}\">\n                        <div style=\"font-size:13px; line-height:1.45\">{{ m.body }}<\u002Fdiv>\n                        <div style=\"font-size:10px; color:var(--color-neutral-600); margin-top:4px; text-align:right\">{{ m.hora }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ chatVacio }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin:auto; text-align:center; font-size:12px; color:var(--color-neutral-600)\">Todavía no hay mensajes con este alumno.<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <form sc-camel-on-submit=\"{{ enviarMsg }}\" style=\"display:flex; gap:var(--space-2); padding:var(--space-4) var(--space-6); box-shadow:inset 0 1px 0 var(--color-divider)\">\n                  <input class=\"input\" placeholder=\"Escribile algo…\" value=\"{{ chatTexto }}\" sc-camel-on-change=\"{{ onChatTexto }}\" style=\"flex:1\">\n                  <button type=\"submit\" class=\"btn btn-primary\" style=\"flex:none\">{{ enviarLabel }}<\u002Fbutton>\n                <\u002Fform>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sinChat }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"height:100%; display:grid; place-items:center; padding:var(--space-8); text-align:center\">\n                <div style=\"max-width:320px; display:flex; flex-direction:column; gap:var(--space-2)\">\n                  <div style=\"font-size:14px\">Elegí un alumno de la lista<\u002Fdiv>\n                  <div style=\"font-size:12px; color:var(--color-neutral-500)\">Los mensajes llegan en vivo: no hace falta recargar la página.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- APP DEL ALUMNO -->\n      <sc-if value=\"{{ esAlumno }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"card elev-sm\" style=\"flex-direction:row; align-items:center; gap:var(--space-4); padding:var(--space-4) var(--space-6); flex-wrap:wrap; margin-bottom:var(--space-6)\">\n          <div style=\"display:flex; align-items:center; gap:var(--space-2)\">\n            <span style=\"font-size:11px; color:var(--color-neutral-500)\">Estás viendo a<\u002Fspan>\n            <sc-raw-select class=\"input\" value=\"{{ demoSelId }}\" sc-camel-on-change=\"{{ cambiarDemoAlumno }}\" style=\"width:220px\">\n              <sc-for list=\"{{ demoOpciones }}\" as=\"o\" hint-placeholder-count=\"8\">\n                <option value=\"{{ o.id }}\">{{ o.nombre }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <span style=\"font-size:11px; color:{{ demoEstadoColor }}\">{{ demoEstado }}<\u002Fspan>\n          <sc-if value=\"{{ demoHayDias }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; gap:5px; flex-wrap:wrap\">\n              <sc-for list=\"{{ demoDias }}\" as=\"dd\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ dd.set }}\" style=\"{{ dd.style }}\" style-hover=\"border-color:var(--color-accent)\">{{ dd.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"margin-left:auto; display:flex; gap:var(--space-2); flex-wrap:wrap\">\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ demoRefr           <sc-for list=\"{{ comidaLista }}\" as=\"cm\" hint-placeholder-count=\"10\">\n            <div style=\"display:flex; align-items:center; gap:9px; padding:7px var(--space-2); border-radius:var(--radius-sm)\">\n              <div style=\"flex:1; min-width:0\">\n                <div style=\"font-size:13px\">{{ cm.nombre }}<\u002Fdiv>\n                <div style=\"font-size:10px; color:var(--color-neutral-500)\">{{ cm.macros }}<\u002Fdiv>\n              <\u002Fdiv>\n              <input class=\"input\" value=\"{{ cm.qty }}\" sc-camel-on-change=\"{{ cm.onQty }}\" inputmode=\"decimal\" style=\"width:66px; text-align:center; padding:5px 6px; font-size:12px\">\n              <span style=\"font-size:11px; color:var(--color-neutral-600); width:18px\">{{ cm.unidad }}<\u002Fspan>\n              <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ cm.agregar }}\" style=\"flex:none; font-size:12px; padding:5px 11px\">Agregar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ comidaSinResultados }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:var(--space-6); text-align:center; font-size:12px; color:var(--color-neutral-500)\">No hay alimentos con ese nombre. Cargalo a mano con el botón “A mano”.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- DIÁLOGO: ALIMENTO -->\n  <sc-if value=\"{{ alimentoAbierto }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:80\">\n      <div class=\"dialog\" style=\"width:min(560px, 100%); max-height:86vh; overflow:auto\">\n        <div class=\"dialog-title\">Agregar alimento a la opción<\u002Fdiv>\n        <div class=\"dialog-body\">Cargá la cantidad exacta y sus macros. Los totales de la opción y del plan se recalculan solos.<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3)\">\n          <sc-for list=\"{{ alimentoCampos }}\" as=\"f\" hint-placeholder-count=\"8\">\n            <div class=\"field\">\n              <label>{{ f.label }}<\u002Flabel>\n              <input class=\"input\" type=\"{{ f.tipo }}\" value=\"{{ f.valor }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.ph }}\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cerrarAlimento }}\">Cancelar<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ guardarAlimento }}\">Guardar alimento<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- DIÁLOGO: ENCUESTA + IA -->\n  <sc-if value=\"{{ encuestaAbierta }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:75\">\n      <div class=\"dialog\" style=\"width:min(620px, 100%); max-height:86vh; overflow:auto\">\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-3)\">\n          <div class=\"dialog-title\">{{ encuestaTitulo }}<\u002Fdiv>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cerrarEncuesta }}\" style=\"margin-left:auto\">Cerrar<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"dialog-body\">Para {{ encuestaAlumno }}. {{ encuestaNota }}<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:var(--space-6)\">\n          <sc-for list=\"{{ encuestaCampos }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex; flex-direction:column; gap:var(--space-2)\">\n              <div style=\"font-size:13px; color:var(--color-neutral-300)\">{{ c.label }}<\u002Fdiv>\n              <sc-if value=\"{{ c.esChips }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex; gap:6px; flex-wrap:wrap\">\n                  <sc-for list=\"{{ c.opciones }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ o.set }}\" style=\"{{ o.style }}\" style-hover=\"border-color:var(--color-accent)\">{{ o.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ c.esTexto }}\" hint-placeholder-val=\"{{ false }}\">\n                <input class=\"input\" value=\"{{ c.valor }}\" sc-camel-on-change=\"{{ c.onTexto }}\" placeholder=\"{{ c.ph }}\">\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cerrarEncuesta }}\">Cancelar<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ encuestaGenerar }}\">{{ encuestaBoton }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- DIÁLOGO: RELOJ -->\n  <sc-if value=\"{{ relojDlg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:70\">\n      <div class=\"dialog\" style=\"width:min(560px, 100%); max-height:86vh; overflow:auto\">\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-3)\">\n          <div class=\"dialog-title\">Reloj de {{ relojDlgEjercicio }}<\u002Fdiv>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cerrarReloj }}\" style=\"margin-left:auto\">Cerrar<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"dialog-body\">Elegí qué reloj ve el alumno en este ejercicio. Es opcional: si no ponés ninguno, sólo corre el descanso normal entre series.<\u002Fdiv>\n\n        <div>\n          <h6 class=\"text-muted\" style=\"margin-bottom:var(--space-2)\">Presets<\u002Fh6>\n          <div style=\"display:flex; gap:6px; flex-wrap:wrap\">\n            <sc-for list=\"{{ presets }}\" as=\"p\" hint-placeholder-count=\"9\">\n              <button type=\"button\" sc-camel-on-click=\"{{ p.usar }}\" style=\"{{ p.style }}\" style-hover=\"border-color:var(--color-accent)\" title=\"{{ p.description }}\">{{ p.name }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"field\">\n          <label>Tipo de reloj<\u002Flabel>\n          <sc-raw-select class=\"input\" value=\"{{ relojKind }}\" sc-camel-on-change=\"{{ setRelojKind }}\">\n            <sc-for list=\"{{ tiposReloj }}\" as=\"t\" hint-placeholder-count=\"7\">\n              <option value=\"{{ t.id }}\">{{ t.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:11px; color:var(--color-neutral-500); margin-top:5px\">{{ relojKindAyuda }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:var(--space-3)\">\n          <sc-for list=\"{{ camposReloj }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div class=\"field\">\n              <label>{{ f.label }}<\u002Flabel>\n              <input class=\"input\" type=\"number\" value=\"{{ f.valor }}\" sc-camel-on-change=\"{{ f.set }}\" min=\"0\">\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:var(--space-4); border-radius:var(--radius-md); background:var(--color-bg); box-shadow:inset 0 0 0 1px var(--color-divider); font-size:12px; color:var(--color-neutral-300)\">{{ relojResumen }}<\u002Fdiv>\n\n        <div class=\"dialog-actions\">\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ quitarReloj }}\" style=\"margin-right:auto; color:var(--color-neutral-500)\">Quitar el reloj<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cerrarReloj }}\">Cancelar<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ guardarReloj }}\">Guardar en el ejercicio<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- DIÁLOGO: ALTA DE ALUMNO -->\n  <sc-if value=\"{{ altaAbierta }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:70\">\n      <div class=\"dialog\" style=\"width:min(520px, 100%); max-height:88vh; overflow:auto\">\n        <sc-if value=\"{{ sinCrear }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; flex-direction:column; gap:var(--space-4)\">\n            <div>\n              <div class=\"dialog-title\">Nuevo alumno<\u002Fdiv>\n              <div class=\"dialog-body\">Al guardarlo se crea su acceso automáticamente: el nombre más los últimos tres números del documento.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Nombre y apellido<\u002Flabel><input class=\"input\" value=\"{{ altaNombre }}\" sc-camel-on-change=\"{{ onAltaNombre }}\" placeholder=\"Ej: Lucía Fernández\"><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3)\">\n              <div class=\"field\"><label>Documento<\u002Flabel><input class=\"input\" value=\"{{ altaDni }}\" sc-camel-on-change=\"{{ onAltaDni }}\" placeholder=\"38.512.774\"><\u002Fdiv>\n              <div class=\"field\"><label>Teléfono<\u002Flabel><input class=\"input\" value=\"{{ altaTel }}\" sc-camel-on-change=\"{{ onAltaTel }}\" placeholder=\"+54 9 11 5555-5555\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\"><label>Objetivo<\u002Flabel><input class=\"input\" value=\"{{ altaObjetivo }}\" sc-camel-on-change=\"{{ onAltaObjetivo }}\" placeholder=\"Ej: bajar 5 kg y ganar fuerza\"><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3)\">\n              <div class=\"field\">\n                <label>Modalidad<\u002Flabel>\n                <sc-raw-select class=\"input\" value=\"{{ altaModalidad }}\" sc-camel-on-change=\"{{ onAltaModalidad }}\">\n                  <option value=\"online\">Online<\u002Foption>\n                  <option value=\"presencial\">Presencial<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div class=\"field\"><label>Días por semana<\u002Flabel><input class=\"input\" type=\"text\" sc-camel-input-mode=\"numeric\" value=\"{{ altaDiasVal }}\" sc-camel-on-change=\"{{ onAltaDias }}\" sc-camel-on-blur=\"{{ altaDiasBlur }}\" placeholder=\"1 a 7\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:var(--space-3); border-radius:var(--radius-md); background:var(--color-bg); box-shadow:inset 0 0 0 1px var(--color-divider); font-size:12px; color:var(--color-neutral-300)\">{{ altaPreview }}<\u002Fdiv>\n            <div class=\"dialog-actions\">\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cerrarAlta }}\">Cancelar<\u002Fbutton>\n              <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ guardarAlta }}\">{{ guardarAltaLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ yaCreado }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:var(--space-4); animation:tn-in .25s ease both\">\n            <div>\n              <div class=\"dialog-title\">{{ creadoNombre }} ya está en el plantel<\u002Fdiv>\n              <div class=\"dialog-body\">Su acceso quedó creado. Mandáselo y ya puede entrar desde el celular.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-6); border-radius:var(--radius-md); background:var(--color-bg); box-shadow:inset 0 0 0 1px var(--color-accent-800)\">\n              <div style=\"display:flex; gap:8px; align-items:baseline\"><span style=\"flex:none; width:88px; font-size:12px; color:var(--color-neutral-500)\">Link<\u002Fspan><span style=\"flex:1; min-width:0; font-size:13px; color:var(--color-accent-200); word-break:break-all\">{{ creadoLink }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:8px; align-items:baseline\"><span style=\"flex:none; width:88px; font-size:12px; color:var(--color-neutral-500)\">Usuario<\u002Fspan><span style=\"font-family:var(--font-heading); font-size:16px; color:var(--color-accent-200)\">{{ creadoUsuario }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:8px; align-items:baseline\"><span style=\"flex:none; width:88px; font-size:12px; color:var(--color-neutral-500)\">Contraseña<\u002Fspan><span style=\"font-family:var(--font-heading); font-size:16px; color:var(--color-accent-200)\">{{ creadoClave }}<\u002Fspan><\u002Fdiv>\n              <button type=\"button\" class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ copiarAcceso }}\">Copiar link, usuario y contraseña<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"dialog-actions\">\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cerrarAlta }}\">Listo<\u002Fbutton>\n              <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ enviarBienvenida }}\">Enviar bienvenida por WhatsApp<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- DIÁLOGO: PICKER -->\n  <sc-if value=\"{{ pickerAbierto }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:60\">\n      <div class=\"dialog\" style=\"width:min(560px, 100%); max-height:84vh; display:flex; flex-direction:column\">\n        <div style=\"display:flex; align-items:baseline; gap:var(--space-3)\">\n          <div class=\"dialog-title\">Agregar ejercicio<\u002Fdiv>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cerrarPicker }}\" style=\"margin-left:auto\">Cerrar<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:11px; color:var(--color-neutral-500)\">{{ pickerDestino }}<\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:var(--space-2); padding:var(--space-3); border-radius:var(--radius-md); background:var(--color-bg); box-shadow:inset 0 0 0 1px var(--color-divider)\">\n          <div style=\"font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-neutral-600)\">Escribirlo a mano, sin imagen<\u002Fdiv>\n          <div style=\"display:flex; gap:var(--space-2)\">\n            <input class=\"input\" placeholder=\"Ej: Caminata en cinta 10 min\" value=\"{{ pickerManual }}\" sc-camel-on-change=\"{{ onPickerManual }}\" style=\"flex:1\">\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ pickerAgregarManual }}\" style=\"flex:none\">Agregar<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:11px; color:var(--color-neutral-600); line-height:1.5\">Va directo a la rutina con el nombre que escribas. No se guarda en la biblioteca ni necesita foto.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <input class=\"input\" placeholder=\"Buscá en tu biblioteca…\" value=\"{{ pickerQuery }}\" sc-camel-on-change=\"{{ onPickerQuery }}\">\n        <div style=\"font-size:11px; color:var(--color-neutral-600)\">{{ pickerConteo }}<\u002Fdiv>\n        <sc-if value=\"{{ pickerPuedeCrear }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ pickerCrear }}\">{{ pickerCrearLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ pickerVacio }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12px; color:var(--color-neutral-500); line-height:1.5\">No hay ejercicios con ese nombre. Podés escribirlo a mano arriba o guardarlo en la biblioteca.<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"overflow:auto; flex:1; min-height:120px; display:flex; flex-direction:column; gap:2px; margin:0 calc(-1 * var(--space-2))\">\n          <sc-for list=\"{{ pickerLista }}\" as=\"p\" hint-placeholder-count=\"8\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.agregar }}\" style=\"display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:7px var(--space-2); border:0; border-radius:var(--radius-sm); background:transparent; color:var(--color-text); font:inherit; font-size:13px; cursor:pointer\" style-hover=\"background:color-mix(in srgb, var(--color-text) 7%, transparent)\">\n              <span style=\"width:38px; height:30px; flex:none; border-radius:4px; overflow:hidden; background:#0f1120\">\n                <sc-if value=\"{{ p.img }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img src=\"{{ p.img }}\" alt=\"\" loading=\"lazy\" style=\"width:100%; height:100%; object-fit:cover; display:block\">\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"flex:1\">{{ p.nombre }}<\u002Fspan>\n              <span class=\"tag tag-neutral\">{{ p.musculo }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- DIÁLOGO: EJERCICIO NUEVO -->\n  <sc-if value=\"{{ nuevoAbierto }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" style=\"z-index:60\">\n      <div class=\"dialog\">\n        <div class=\"dialog-title\">Ejercicio sin imagen<\u002Fdiv>\n        <div class=\"dialog-body\">Se guarda en la biblioteca igual que los importados de Drive. Si después aparece una imagen con el mismo nombre, la sincronización la asocia sola.<\u002Fdiv>\n        <div class=\"field\"><label>Nombre<\u002Flabel><input class=\"input\" value=\"{{ nuevoNombre }}\" sc-camel-on-change=\"{{ onNuevoNombre }}\" placeholder=\"Ej: Zancada búlgara con banda\"><\u002Fdiv>\n        <div class=\"field\"><label>Grupo muscular<\u002Flabel><input class=\"input\" value=\"{{ nuevoMusculo }}\" sc-camel-on-change=\"{{ onNuevoMusculo }}\" placeholder=\"Cuádriceps\"><\u002Fdiv>\n        <div class=\"field\"><label>Equipo<\u002Flabel><input class=\"input\" value=\"{{ nuevoEquipo }}\" sc-camel-on-change=\"{{ onNuevoEquipo }}\" placeholder=\"Mancuernas\"><\u002Fdiv>\n        <div class=\"dialog-actions\">\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cerrarNuevo }}\">Cancelar<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ guardarNuevo }}\">Guardar ejercicio<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ esPanelAlumno }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:150; overflow:auto; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body)\">\n      <div style=\"max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:var(--space-6) var(--space-4) 88px\">\n\n        <header style=\"display:flex; align-items:center; gap:11px; margin-bottom:var(--space-6)\">\n          <div style=\"width:38px; height:38px; flex:none; border-radius:50%; background:var(--color-accent-800); color:var(--color-accent-100); display:grid; place-items:center; font-size:14px\">{{ alIniciales }}<\u002Fdiv>\n          <div style=\"flex:1; min-width:0\">\n            <div style=\"font-family:var(--font-heading); font-size:18px\">{{ alSaludo }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:var(--color-neutral-500)\">{{ alSubtitulo }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hayPendientes }}\" hint-placeholder-val=\"{{ false }}\">\n            <span class=\"tag tag-outline\" style=\"flex:none; font-size:10px\">{{ pendientesSubir }}<\u002Fspan>\n          <\u002Fsc-if>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ salir }}\" style=\"flex:none; font-size:11px\">Salir<\u002Fbutton>\n        <\u002Fheader>\n\n        <!-- CUENTA SUSPENDIDA -->\n        <sc-if value=\"{{ alSuspendido }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card elev-md\" style=\"padding:var(--space-8); gap:var(--space-3); align-items:flex-start; animation:tn-in .3s ease both; box-shadow:inset 0 0 0 1px var(--tn-warn-900), var(--shadow-md)\">\n            <span class=\"tag tag-accent-2\">Cuenta en pausa<\u002Fspan>\n            <div style=\"font-family:var(--font-heading); font-size:20px\">Tu plan está pausado<\u002Fdiv>\n            <p class=\"card-body\" style=\"line-height:1.6\">Nico pausó tu acceso al plan de entrenamiento y de comidas. Tus datos, tu historial y tus marcas quedan guardados: cuando lo reactive vas a encontrar todo igual.<\u002Fp>\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ irChatAlumno }}\">Escribirle a Nico<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- LA RUTA -->\n        <sc-if value=\"{{ alEsRuta }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:var(--space-5); animation:tn-in .3s ease both\">\n\n            <sc-if value=\"{{ rutaSinRuta }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"card elev-sm\" style=\"padding:var(--space-6); gap:var(--space-3); align-items:flex-start\">\n                <span class=\"tag tag-outline\" style=\"font-size:10px\">Todavía sin ruta<\u002Fspan>\n                <div style=\"font-family:var(--font-heading); font-size:19px; line-height:1.25\">Nico te va a armar tu ruta<\u002Fdiv>\n                <p class=\"card-body\" style=\"margin:0; line-height:1.6\">Se calcula sobre los pesos que movés hoy, no sobre una tabla genérica. Cargá algunas sesiones y aparece acá con tus primeros hitos.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ rutaHay }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex; flex-direction:column; gap:var(--space-5)\">\n                <div class=\"card elev-sm\" style=\"padding:var(--space-5); gap:var(--space-3)\">\n                  <div style=\"display:flex; align-items:flex-end; gap:var(--space-3)\">\n                    <div style=\"flex:1; min-width:0\">\n                      <div style=\"font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-500)\">{{ rutaEtapaLabel }}<\u002Fdiv>\n                      <div style=\"font-family:var(--font-heading); font-size:22px; line-height:1.2\">{{ rutaNombre }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-family:var(--font-heading); font-size:34px; line-height:1; color:var(--color-accent-200); font-variant-numeric:tabular-nums\">{{ rutaPctLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"height:4px; border-radius:99px; background:var(--color-neutral-900); overflow:hidden\"><div style=\"{{ rutaBarra }}\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-size:11.5px; color:var(--color-neutral-500)\">{{ rutaResumen }}<\u002Fdiv>\n                  <sc-if value=\"{{ rutaHayDonde }}\" hint-placeholder-val=\"{{ false }}\">\n                    <p style=\"margin:0; padding-top:10px; border-top:1px solid var(--color-divider); font-size:13px; line-height:1.55; color:var(--color-accent-100)\">{{ rutaDondeQuedaste }}<\u002Fp>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <div style=\"display:flex; gap:var(--space-4)\">\n                  <sc-for list=\"{{ rutaLeyenda }}\" as=\"lg\" hint-placeholder-count=\"3\">\n                    <div style=\"{{ lg.style }}\"><span style=\"{{ lg.punto }}\"><\u002Fspan>{{ lg.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"d ont-size:10px; color:var(--color-neutral-500)\">Próximo hito<\u002Fspan>\n                  <span style=\"font-size:11px; color:var(--color-neutral-400); font-variant-numeric:tabular-nums\">{{ rutaTira.pct }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:14px; line-height:1.3\">{{ rutaTira.titulo }}<\u002Fdiv>\n                <div style=\"height:3px; border-radius:99px; background:var(--color-neutral-900); overflow:hidden\"><div style=\"{{ rutaTira.barra }}\"><\u002Fdiv><\u002Fdiv>\n                <div style=\"font-size:11.5px; color:var(--color-neutral-400)\">{{ rutaTira.falta }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex; gap:var(--space-2); overflow-x:auto; padding-bottom:2px\">\n              <sc-for list=\"{{ alDias }}\" as=\"d\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\" style-hover=\"border-color:var(--color-accent)\">\n                  <span style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; opacity:.6\">{{ d.n }}<\u002Fspan>\n                  <span>{{ d.nombre }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex; align-items:center; gap:10px\">\n              <div style=\"flex:1; height:3px; border-radius:99px; background:var(--color-neutral-900); overflow:hidden\"><div style=\"{{ sesionBarra }}\"><\u002Fdiv><\u002Fdiv>\n              <span style=\"font-size:11px; color:var(--color-neutral-500); white-space:nowrap\">{{ sesionProgreso }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <div class=\"card elev-sm\" style=\"padding:var(--space-4); gap:var(--space-3)\">\n              <div style=\"display:flex; align-items:center; gap:12px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ zoomEjActual }}\" title=\"Ver la imagen en grande\" style=\"wid      <span style=\"font-size:10px; color:var(--color-accent-300)\">{{ relojRonda }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:14px\">\n                  <div style=\"font-family:var(--font-heading); font-size:52px; line-height:1; font-variant-numeric:tabular-nums; color:{{ relojColor }}\">{{ relojTiempo }}<\u002Fdiv>\n                  <div style=\"flex:1; min-width:0\">\n                    <div style=\"font-size:12px; color:var(--color-neutral-400); margin-bottom:5px\">{{ relojFase }}<\u002Fdiv>\n                    <div style=\"height:4px; border-radius:99px; background:var(--color-neutral-900); overflow:hidden\"><div style=\"{{ relojBarra }}\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:7px\">\n                  <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ relojPlay }}\" style=\"flex:1; height:46px\">{{ relojPlayLabel }}<\u002Fbutton>\n                  <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ relojReset }}\" style=\"flex:none; height:46px\">Reiniciar<\u002Fbutton>\n                  <sc-if value=\"{{ relojVuelta }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ relojVueltaFn }}\" style=\"flex:none; height:46px\">+ Ronda<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hayElogio }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:var(--radius-md); background:var(--color-accent-900); box-shadow:inset 0 0 0 1px var(--color-accent-700); animation:tn-in .25s ease both\">\n                <span style=\"flex:1; font-size:13px; line-height:1.5; color:var(--color-accent-100)\">{{ elogio }}<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ cerrarElogio }}\" title=\"Cerrar\" style=\"flex:none; border:0; background:transparent; color:var(--color-accent-300); font:inherit; font-size:15px; line-height:1; cursor:pointer\">×<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex; flex-direction:column; gap:7px\">\n              <sc-for list=\"{{ series }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"{{ s.filaGrande }}\">\n                  <div style=\"width:16px; flex:none; font-size:12px; color:var(--color-neutral-600)\">{{ s.n }}<\u002Fdiv>\n                  <div style=\"display:flex; align-items:center; gap:4px; flex:none\">\n                    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ s.menosPeso }}\" style=\"width:38px; height:44px; padding:0; font-size:17px\">−<\u002Fbutton>\n                    <div style=\"width:62px; text-align:center\"><input class=\"input\" type=\"text\" sc-camel-input-mode=\"decimal\" value=\"{{ s.pesoTxt }}\" sc-camel-on-change=\"{{ s.onPeso }}\" sc-camel-on-blur=\"{{ s.pesoBlur }}\" style=\"width:62px; height:30px; min-height:30px; padding:0; text-align:center; font-size:19px; font-variant-numeric:tabular-nums; background:transparent; border-color:var(--color-neutral-800)\" style-focus=\"border-color:var(--color-accent)\"><div style=\"font-size:9px; color:var(--color-neutral-600); line-height:1\">kg<\u002Fdiv><\u002Fdiv>\n                    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ s.masPeso }}\" style=\"width:38px; height:44px; padding:0; font-size:17px\">+<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; align-items:center; gap:4px; flex:none\">\n                    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ s.menosReps }}\" style=\"width:38px; height:44px; padding:0; font-size:17px\">−<\u002Fbutton>\n                    <div style=\"width:42px; text-align:center\"><input class=\"input\" type=\"text\" sc-camel-input-mode=\"numeric\" value=\"{{ s.repsTxt }}\" sc-camel-on-change=\"{{ s.onReps }}\" sc-camel-on-blur=\"{{ s.repsBlur }}\" style=\"width:42px; height:30px; min-height:30px; padding:0; text-align:center; font-size:19px; font-variant-numeric:tabular-nums; background:transparent; border-color:var(--color-neutral-800)\" style-focus=\"border-color:var(--color-accent)\"><div style=\"font-size:9px; color:var(--color-neutral-600); line-height:1\">reps<\u002Fdiv><\u002Fdiv>\n                    <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ s.masReps }}\" style=\"width:38px; height:44px; padding:0; font-size:17px\">+<\u002Fbutton>\n                  <\u002Fdiv>\n                  <button type=\"button\" sc-camel-on-click=\"{{ s.ciclarRir }}\" style=\"{{ s.rirGrande }}\">{{ s.rirLabel }}<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ s.completar }}\" style=\"{{ s.checkGrande }}\">✓<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ agregarSerie }}\" style=\"align-self:flex-start\">+ Serie extra<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ descansando }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:sticky; bottom:76px; display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:var(--radius-md); background:var(--color-accent-900); box-shadow:inset 0 0 0 1px var(--color-accent-700), var(--shadow-md)\">\n                <div style=\"font-family:var(--font-heading); font-size:28px; color:var(--color-accent-200); font-variant-numeric:tabular-nums\">{{ descansoLabel }}<\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--color-accent-300); flex:1\">Descanso en curso
